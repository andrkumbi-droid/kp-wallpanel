<!-- ═══════════════════════════════════════════════════════════════════════════
     CONTAINER INVESTMENTS  ·  André & Alex
     ---------------------------------------------------------------------------
     Eigene Seite, eigener Datenpfad (v2/invest/…). Das hier ist NICHT die
     KP-App: keine Orders, keine Touren, kein Lager. Die Seite teilt sich nur
     das Firebase-Projekt und den Login-Bausatz, weil das schon da ist und
     funktioniert. Verlinkt ist sie nirgends — man kommt über die URL rein,
     und dann nur mit PIN.

     Sprache: Deutsch. Hier lesen nur André und Alex mit, nicht das Büro.
     ═══════════════════════════════════════════════════════════════════════ -->

var APPCHECK_SITE_KEY = '6LebwYgtAAAAAB9LWZ91x3eZfllT9mPsV3Y8Vfpv';
function acReachable(){
  return new Promise(function(res){
    var to=setTimeout(function(){ res(false); }, 5000);
    fetch('https://www.google.com/recaptcha/api.js',{mode:'no-cors'})
      .then(function(){ clearTimeout(to); res(true); })
      .catch(function(){ clearTimeout(to); res(false); });
  });
}
var iAppCheckReady = new Promise(function(resolve){
  var _acOff=false; try{ _acOff=localStorage.getItem('kpAcOff')==='1'; }catch(e){}
  if(_acOff){ resolve(false); return; }
  if(!APPCHECK_SITE_KEY || !firebase.appCheck){ resolve(false); return; }
  function go(){
    try{
      if(/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname) || location.protocol==='file:'){
        var _q=(location.search.match(/[?&]acdebug=([^&]+)/)||[])[1];
        if(_q){ try{ localStorage.setItem('kpAcDebugToken', decodeURIComponent(_q)); }catch(e){} }
        var _saved=''; try{ _saved=localStorage.getItem('kpAcDebugToken')||''; }catch(e){}
        if(!_saved){ resolve(false); return; }     // unregistrierter Token haengt die RTDB auf
        self.FIREBASE_APPCHECK_DEBUG_TOKEN=_saved;
      }
      firebase.appCheck().activate(APPCHECK_SITE_KEY, true);
      window._iAcOn=true; resolve(true);
    }catch(e){ resolve(false); }
  }
  function whenBody(fn){ if(document.body) fn(); else setTimeout(function w(){ document.body?fn():setTimeout(w,5); },0); }
  acReachable().then(function(ok){ ok ? whenBody(go) : resolve(false); });
});

            raw:function(p){ return _rootDb.ref(SEASON+'/'+(p==null?'':p)); } };
function _iAcRetry(){
  try{
    if(window._iAcOn && !sessionStorage.getItem('kpAcRetry')){
      sessionStorage.setItem('kpAcRetry','1');
      localStorage.setItem('kpAcOff','1');
      setTimeout(function(){ location.reload(); }, 400);
      return true;
    }
  }catch(e){}
  return false;
}
function _iSignIn(attempt){
  return (window.kpAuthEnsure ? kpAuthEnsure('invest',{prompt:'never'}) : firebase.auth().signInAnonymously())
    .then(function(){ return true; })
    .catch(function(){
      if(_iAcRetry()) return false;
      var wait=Math.min(30000, 2000*Math.pow(2, Math.min(attempt-1,4)));
      return new Promise(function(res){ setTimeout(function(){ res(_iSignIn(attempt+1)); }, wait); });
    });
}

<style>
/* ══════════════════════════════════════════════════════════════════════════
   TRESOR
   Fast schwarz, damit Zahlen leuchten. Zwei Signalfarben, mehr nicht:
   Gold gehoert Alex, Mint gehoert Andre — ueberall, in jedem Balken, in
   jeder Kachel. Wer wieviel hat, soll man sehen koennen, ohne zu lesen.
   Zahlen laufen immer in Tabellenziffern, damit Spalten stehen.
   Einthemig dunkel: ein Kontoauszug um Mitternacht.
   ══════════════════════════════════════════════════════════════════════════ */
:root{
  --bg:#151821; --panel:#1E222C; --panel2:#252A36; --panel3:#2F3542;
  --edge:#3A4153; --edge2:#4C5467;
  --ink:#F2F5FA; --ink2:#AEB6C6; --ink3:#848CA0;
  --alex:#E8B84B; --alexD:#8A6D1F;      /* Gold  = Alex   */
  --andre:#3DD68C; --andreD:#1E7350;    /* Mint  = André  */
  --blue:#5B9DFF; --red:#FF6B6B; --amber:#FFA23E;
  --sys:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Thai","Leelawadee UI",sans-serif;
  --num:ui-monospace,"SF Mono","Cascadia Mono",Consolas,"DejaVu Sans Mono",monospace;
  --r:14px;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:
    radial-gradient(1100px 520px at 15% -10%, #242938 0%, transparent 62%),
    radial-gradient(900px 480px at 92% 0%, #1F2A28 0%, transparent 58%),
    var(--bg);
  background-attachment:fixed;
  color:var(--ink);font-family:var(--sys);font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
.n{font-family:var(--num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px 90px}
button{font-family:inherit}

/* ── PIN ─────────────────────────────────────────────────────────────────── */
#gate{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:16px;padding:24px;
  background:radial-gradient(760px 420px at 50% 18%, #262B38 0%, var(--bg) 70%)}
#gate .logo{width:56px;height:56px;border-radius:16px;display:flex;align-items:center;
  justify-content:center;background:linear-gradient(145deg,#2A2F3C,#1A1E27);
  border:1px solid var(--edge2);box-shadow:0 10px 30px rgba(0,0,0,.6)}
#gate .logo svg{width:30px;height:30px}
#gate h1{font-size:19px;margin:6px 0 0;font-weight:750;letter-spacing:-.2px}
#gate .sub{font-size:12.5px;color:var(--ink3);letter-spacing:.16em;text-transform:uppercase;font-weight:700}
.dots{display:flex;gap:9px;height:14px;align-items:center;margin:4px 0 2px}
.dot{width:10px;height:10px;border-radius:50%;background:transparent;border:1.6px solid var(--edge2);transition:.14s}
.dot.on{background:var(--alex);border-color:var(--alex);box-shadow:0 0 12px rgba(232,184,75,.45)}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:11px}
.pad button{height:62px;border-radius:14px;border:1px solid var(--edge);background:var(--panel2);
  color:var(--ink);font-size:21px;font-weight:650;cursor:pointer;font-family:var(--num);transition:.1s}
.pad button:active{transform:scale(.94);background:var(--panel3)}
.pad button.ok{background:linear-gradient(160deg,#2A6F51,#1B4E38);border-color:#2E7D5B;color:#D8FFEC}
.pad button.del{color:var(--ink3);font-size:18px}
#pin-err{font-size:13.5px;color:var(--red);min-height:36px;text-align:center;max-width:280px}
.shake{animation:sh .34s}
@keyframes sh{0%,100%{transform:translateX(0)}22%{transform:translateX(-8px)}55%{transform:translateX(7px)}80%{transform:translateX(-3px)}}

/* ── Kopf ────────────────────────────────────────────────────────────────── */
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:20px 0 14px}
header h1{font-size:19px;margin:0;font-weight:750;letter-spacing:-.3px;display:flex;align-items:center;gap:9px}
header h1 svg{width:21px;height:21px;flex:none}
.who{font-size:12px;color:var(--ink2);background:var(--panel2);border:1px solid var(--edge);
  border-radius:20px;padding:5px 11px;font-weight:600}
.who b{color:var(--ink)}
.spacer{flex:1}
.ghost{background:var(--panel2);border:1px solid var(--edge);color:var(--ink2);border-radius:10px;
  padding:7px 12px;font-size:12.5px;font-weight:650;cursor:pointer;transition:.12s}
.ghost:hover{border-color:var(--edge2);color:var(--ink)}

/* ── Reiter ──────────────────────────────────────────────────────────────── */
nav{display:flex;gap:4px;background:var(--panel);border:1px solid var(--edge);border-radius:12px;
  padding:4px;margin-bottom:20px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:1;min-width:104px;white-space:nowrap;border:0;background:transparent;color:var(--ink3);
  font-size:13px;font-weight:650;padding:9px 12px;border-radius:9px;cursor:pointer;transition:.13s}
nav button:hover{color:var(--ink2)}
nav button.on{background:var(--panel3);color:var(--ink);box-shadow:0 1px 0 rgba(255,255,255,.05) inset}

/* ── Kacheln ─────────────────────────────────────────────────────────────── */
.tiles{display:grid;gap:12px;margin-bottom:14px}
.g5{grid-template-columns:repeat(auto-fit,minmax(178px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(215px,1fr))}
.tile{background:linear-gradient(165deg,var(--panel2),var(--panel));border:1px solid var(--edge);
  border-radius:var(--r);padding:14px 15px;position:relative;overflow:hidden}
.tile::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--edge2)}
.tile.a::before{background:linear-gradient(180deg,var(--alex),var(--alexD))}
.tile.n::before{background:linear-gradient(180deg,var(--andre),var(--andreD))}
.tile .k{font-size:11.5px;color:var(--ink3);font-weight:650;text-transform:uppercase;letter-spacing:.06em}
.tile .v{font-size:23px;font-weight:700;margin-top:6px;letter-spacing:-.6px}
.tile .v small{font-size:13px;font-weight:600;color:var(--ink3);margin-left:3px;letter-spacing:0}
.tile .s{font-size:11.5px;color:var(--ink3);margin-top:3px}
.va{color:var(--alex)} .vn{color:var(--andre)} .vr{color:var(--red)} .vb{color:var(--blue)}

/* ── Abschnitte ──────────────────────────────────────────────────────────── */
.sec{margin:26px 0 12px;display:flex;align-items:center;gap:10px}
.sec h2{font-size:13px;margin:0;font-weight:700;color:var(--ink2);text-transform:uppercase;letter-spacing:.09em}
.sec .line{flex:1;height:1px;background:var(--edge)}
.card{background:var(--panel);border:1px solid var(--edge);border-radius:var(--r);padding:16px}
.muted{color:var(--ink3);font-size:13px}
.empty{text-align:center;color:var(--ink3);padding:34px 14px;font-size:13.5px;
  border:1px dashed var(--edge2);border-radius:var(--r)}

/* ── Geld-Balken (wo liegt Alex' Geld) ───────────────────────────────────── */
.stack{height:30px;border-radius:9px;overflow:hidden;display:flex;background:var(--panel3);
  border:1px solid var(--edge);margin:12px 0 9px}
.stack i{display:block;height:100%}
.leg{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--ink2)}
.leg span{display:flex;align-items:center;gap:6px}
.leg b{width:9px;height:9px;border-radius:3px;display:inline-block}

/* ── Verlauf (Diagramm) ──────────────────────────────────────────────────── */
.ch-head{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.ch-hero .k{font-size:11px;color:var(--ink3);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.ch-hero .v{font-size:22px;font-weight:750;letter-spacing:-.5px;font-family:var(--num);margin-top:2px}
.ch-hero .s{font-size:12px;color:var(--ink2);margin-top:2px;font-family:var(--num)}
.ch-hero.fut .v{color:var(--ink2);font-size:17px;margin-top:6px}
.cur{margin-left:auto;display:flex;background:var(--panel2);border:1px solid var(--edge);border-radius:9px;padding:2px}
.cur button{border:0;background:transparent;color:var(--ink3);font-weight:700;font-size:12.5px;
  padding:5px 11px;border-radius:7px;cursor:pointer}
.cur button.on{background:var(--panel3);color:var(--ink)}
.chart{position:relative;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.chart svg{display:block;width:100%;overflow:visible}
.chart text{fill:var(--ink3);font-size:10.5px;font-family:var(--sys)}
.ch-tip{position:absolute;top:6px;pointer-events:none;background:var(--panel3);border:1px solid var(--edge2);
  border-radius:10px;padding:8px 10px;font-size:12px;min-width:150px;box-shadow:0 8px 24px rgba(0,0,0,.45);display:none}
.ch-tip .d{color:var(--ink3);font-size:11px;margin-bottom:4px}
.ch-tip .r{display:flex;justify-content:space-between;gap:12px;font-family:var(--num)}
.ch-tip .r span:first-child{font-family:var(--sys);color:var(--ink2)}
.ch-note{font-size:11.5px;color:var(--ink3);margin-top:8px}
.chart .lbl{font-size:10.5px}
.chart .lbl.v{fill:var(--ink);font-weight:700;font-family:var(--num)}
.ch-tip .ev{border-top:1px solid var(--edge);margin-top:5px;padding-top:5px;font-size:11.5px;color:var(--ink2);line-height:1.45}
.ch-tip .ev b{color:var(--ink)}

/* ── Zeitplan der Container (Balken je Container) ────────────────────────── */
.gx{position:relative;height:18px;margin-left:190px;margin-bottom:4px}
.gx span{position:absolute;top:0;transform:translateX(-50%);font-size:10.5px;color:var(--ink3)}
.gr{display:grid;grid-template-columns:180px 1fr;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--edge)}
.gr:first-of-type{border-top:0}
.gn b{display:block;font-size:13px}
.gn span{display:block;font-size:11px;color:var(--ink3);font-family:var(--num);margin-top:1px}
.gt{position:relative;height:16px;background:var(--panel2);border-radius:5px}
.gt i{position:absolute;top:3px;height:10px;border-radius:4px}
.gt .g-way{background:repeating-linear-gradient(135deg,rgba(185,164,255,.55) 0 4px,rgba(185,164,255,.18) 4px 8px)}
.gt .g-run{background:linear-gradient(90deg,#3B6FC0,var(--blue))}
.gt .g-dn{background:linear-gradient(90deg,var(--andreD),var(--andre))}
.gt .g-s,.gt .g-e{position:absolute;top:50%;width:11px;height:11px;margin:-5.5px 0 0 -5.5px;border-radius:50%;
  border:2px solid var(--panel)}
.gt .g-s{background:var(--ink2);border-radius:3px}
.gt .g-e.ok{background:var(--andre)}
.gt .g-e.op{background:var(--panel);border-color:var(--blue)}
.gt .g-t{position:absolute;top:-6px;bottom:-6px;width:0;border-left:1px dashed var(--ink3)}
.gd{grid-column:2;font-size:11.5px;color:var(--ink2);margin-top:-2px;font-family:var(--num)}
.gd em{font-style:normal;color:var(--ink3);font-family:var(--sys)}
@media(max-width:620px){
  .gx{margin-left:0}
  .gr{grid-template-columns:1fr;gap:6px}
  .gd{grid-column:1}
}

/* ── Container-Karten ────────────────────────────────────────────────────── */
/* Immer drei Karten pro Reihe (André will das so, auch im schmalen Fenster),
   am Tablet zwei, am Telefon eine. Flex statt Grid, damit eine halbvolle
   Reihe mittig sitzt: jede Karte ist genau ein Drittel breit und wächst
   nicht, der Rest verteilt sich links und rechts. */
.cgrid{display:flex;flex-wrap:wrap;gap:13px;justify-content:center}
.cgrid>.cc{flex:0 1 calc((100% - 26px)/3);min-width:0}
@media(max-width:760px){.cgrid>.cc{flex-basis:calc((100% - 13px)/2)}}
.cc{background:linear-gradient(168deg,var(--panel2) 0%,var(--panel) 62%);border:1px solid var(--edge);
  border-radius:16px;padding:15px 16px 14px;position:relative;transition:.15s}
.cc:hover{border-color:var(--edge2)}
.cc.done{opacity:.72}
.cc.late{border-color:#7A3A3A;background:linear-gradient(168deg,#2B2128 0%,var(--panel) 62%)}
.cc .top{display:flex;align-items:flex-start;gap:9px;margin-bottom:11px}
.cc .nm{font-size:15.5px;font-weight:700;letter-spacing:-.2px}
.cc .dt{font-size:11.5px;color:var(--ink3);margin-top:2px}
.pill{font-size:10.5px;font-weight:750;padding:4px 9px;border-radius:20px;white-space:nowrap;
  text-transform:uppercase;letter-spacing:.05em;border:1px solid transparent}
.p-run{background:rgba(91,157,255,.12);color:var(--blue);border-color:rgba(91,157,255,.28)}
.p-soon{background:rgba(255,162,62,.13);color:var(--amber);border-color:rgba(255,162,62,.3)}
.p-late{background:rgba(255,107,107,.13);color:var(--red);border-color:rgba(255,107,107,.3)}
.p-way{background:rgba(170,140,255,.12);color:#B9A4FF;border-color:rgba(170,140,255,.3)}
.p-done{background:rgba(61,214,140,.12);color:var(--andre);border-color:rgba(61,214,140,.28)}
.price{font-size:20px;font-weight:700;letter-spacing:-.5px}
.price small{font-size:11.5px;color:var(--ink3);font-weight:600;margin-left:5px;letter-spacing:0}
.split{height:7px;border-radius:5px;overflow:hidden;display:flex;background:var(--panel3);margin:11px 0 3px}
.split i{height:100%}
.splitlab{display:flex;justify-content:space-between;font-size:11px;color:var(--ink3);margin-bottom:11px}
.kv{display:grid;grid-template-columns:1fr auto auto;gap:3px 12px;font-size:12.5px;align-items:baseline}
.kv .h{color:var(--ink3);font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding-bottom:3px}
.kv .l{color:var(--ink2)}
.kv .x{text-align:right;font-weight:650}
.prog{margin-top:12px}
.prog .bar{height:5px;border-radius:4px;background:var(--panel3);overflow:hidden}
.prog .bar i{display:block;height:100%;border-radius:4px;
  background:linear-gradient(90deg,var(--andreD),var(--andre))}
.prog .bar i.late{background:linear-gradient(90deg,#7A2B2B,var(--red))}
.prog .t{display:flex;justify-content:space-between;font-size:11px;color:var(--ink3);margin-top:5px}
.acts{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.acts button{flex:1;min-width:64px;background:var(--panel3);border:1px solid var(--edge);color:var(--ink2);
  border-radius:9px;padding:7px 8px;font-size:12px;font-weight:650;cursor:pointer;transition:.12s}
.acts button:hover{border-color:var(--edge2);color:var(--ink)}
.acts button.go{background:linear-gradient(160deg,#245C45,#183F30);border-color:#2C6E52;color:#CFF6E4}
.acts button.dl{flex:0 0 40px;min-width:40px;color:var(--ink3)}
.acts button.dl:hover{color:var(--red);border-color:#7A3A3A}

/* ── Zeitstrahl ──────────────────────────────────────────────────────────── */
.tl{display:flex;flex-direction:column;gap:2px}
.tlr{display:grid;grid-template-columns:auto 1fr auto;gap:13px;align-items:center;
  padding:11px 4px;border-bottom:1px solid var(--edge)}
.tlr:last-child{border-bottom:0}
.tlr .d{font-family:var(--num);font-size:12.5px;color:var(--ink2);min-width:74px;font-variant-numeric:tabular-nums}
.tlr .d em{display:block;font-style:normal;font-size:10.5px;color:var(--ink3)}
.tlr .nm{font-size:13.5px;font-weight:650}
.tlr .mini{height:4px;border-radius:3px;background:var(--panel3);overflow:hidden;margin-top:5px;max-width:320px}
.tlr .mini i{display:block;height:100%;background:linear-gradient(90deg,var(--andreD),var(--andre))}
.tlr .mini i.late{background:var(--red)}
/* Einsatz, Gewinn und Auszahlung nebeneinander — sonst weiss man bei einer
   einzigen Zahl nie, ob das eigene Geld schon drinsteckt. */
.tlr .amt{display:grid;grid-template-columns:auto repeat(3,minmax(76px,auto));gap:1px 14px;
  font-family:var(--num);font-variant-numeric:tabular-nums;font-size:12.5px;text-align:right;
  align-items:baseline;justify-content:end}
.tlr .amt .h{font-family:var(--sys);font-size:9.5px;color:var(--ink3);font-weight:700;
  text-transform:uppercase;letter-spacing:.05em;padding-bottom:3px}
.tlr .amt .pn{font-family:var(--sys);font-size:11.5px;font-weight:700;text-align:left}
.tlr .amt .tot{font-weight:700;color:var(--ink)}

/* ── Tabelle (Konto) ─────────────────────────────────────────────────────── */
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:10.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.07em;
  font-weight:700;padding:0 10px 9px;border-bottom:1px solid var(--edge)}

<script>
/* ═══════════════════════════════════════════════════════════════════════════
   1 · WERKZEUG
   ═══════════════════════════════════════════════════════════════════════════ */
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

/* Zahlen kommen hier aus zwei Welten: aus dem deutschen Sheet (1.234,56) und
   aus der Tastatur (1234.56). Beides muss gehen, ohne dass aus 1.234 eine
   1,234 wird. Regel: das LETZTE Trennzeichen entscheidet, alles davor ist
   Tausenderpunkt. */
function num(v){
  if(typeof v==='number') return isFinite(v)?v:0;
  var s=String(v==null?'':v).replace(/[^\d.,\-]/g,'').trim();
  if(!s) return 0;
  var lc=s.lastIndexOf(','), ld=s.lastIndexOf('.');
  if(lc>-1 && ld>-1){
    if(lc>ld) s=s.replace(/\./g,'').replace(',','.');      // 1.234,56
    else      s=s.replace(/,/g,'');                        // 1,234.56
  } else if(lc>-1){
    s=s.replace(/,/g,'.');                                 // 1234,56 → deutsches Komma
  } else if(/^-?\d{1,3}(\.\d{3})+$/.test(s)){
    s=s.replace(/\./g,'');                                 // 650.265 = 650265, nicht 650,265
  }
  var n=parseFloat(s);
  return isFinite(n)?n:0;
}
var NF2=new Intl.NumberFormat('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2});
var NF0=new Intl.NumberFormat('de-DE',{maximumFractionDigits:0});
function B(v){ return '฿'+NF2.format(+v||0); }            // voll, mit Satang
function B0(v){ return '฿'+NF0.format(Math.round(+v||0)); } // kompakt
function pct(v){ return NF0.format(+v||0)+'%'; }

/* Datum. Intern immer YYYY-MM-DD, weil <input type=date> nichts anderes mag.
   Nie valueAsDate benutzen — das liest UTC und macht aus heute morgens
   gestern. (Dieselbe Falle wie in der KP-App.) */
function p2(n){ return (n<10?'0':'')+n; }
function todayISO(){ var d=new Date(); return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate()); }
function deDate(iso){ if(!iso) return '—'; var p=String(iso).split('-'); return p.length===3?(p[2]+'.'+p[1]+'.'+p[0]):iso; }
function shortDate(iso){ if(!iso) return '—'; var p=String(iso).split('-'); return p.length===3?(p[2]+'.'+p[1]+'.'):iso; }
function addM(iso,m){
  if(!iso) return '';
  var p=String(iso).split('-'); if(p.length!==3) return '';
  var y=+p[0], mo=+p[1]-1, d=+p[2];
  var want=((mo+m)%12+12)%12;
  var dt=new Date(Date.UTC(y,mo+m,d));
  if(dt.getUTCMonth()!==want) dt=new Date(Date.UTC(y,mo+m+1,0));   // 31.12 +2 → 28./29.02
  return dt.toISOString().slice(0,10);
}
function dayNo(iso){ var p=String(iso||'').split('-'); if(p.length!==3) return null;
  return Math.floor(Date.UTC(+p[0],+p[1]-1,+p[2])/86400000); }
function daysTo(iso){ var a=dayNo(iso), b=dayNo(todayISO()); return (a==null||b==null)?null:(a-b); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

var _st;
function say(t,ms){ var e=$('status'); e.textContent=t; e.classList.add('on');
  clearTimeout(_st); _st=setTimeout(function(){ e.classList.remove('on'); }, ms||2200); }
function oops(){ say('Speichern fehlgeschlagen — Verbindung?',3600); }

/* ═══════════════════════════════════════════════════════════════════════════
   2 · ZUSTAND
   ═══════════════════════════════════════════════════════════════════════════ */
var staffList=[], ACC={}, CTS={}, LED={}, CFG={}, VIS={}, me=null, role='view', boss=false, view='over';
/* Nur dieser eine KP-Datensatz oeffnet die Seite ueber den KP-PIN. Frueher
   reichte das Buchhaltungsrecht — das haben aber auch Pim und Nicky, und die
   haben mit Alex' Geld nichts zu tun. Alle weiteren Zugaenge laufen ueber
   invest/access. */
var OWNER_STAFF='st1779766154832';   // André
var DEF={ rate:10, months:2, soloAlex:70 };   // 10 % auf zwei Monate; allein → 70/30
function cfg(k){ return (CFG && CFG[k]!=null && CFG[k]!=='') ? +CFG[k] : DEF[k]; }
function canEdit(){ return role==='owner'; }

/* Container als sortierte Liste. Reihenfolge: das, was als naechstes faellig
   ist, zuerst; Abgeschlossenes rutscht nach unten. */
function list(){
  return Object.keys(CTS).map(function(k){ var c=Object.assign({},CTS[k]); c.id=k; return c; })
    .sort(function(a,b){
      if(!!a.paid!==!!b.paid) return a.paid?1:-1;
      var da=due(a)||'9999', db=due(b)||'9999';
      return da<db?-1:da>db?1:0;
    });
}
function ledger(){
  return Object.keys(LED).map(function(k){ var l=Object.assign({},LED[k]); l.id=k; return l; })
    .sort(function(a,b){ return (b.date||'')<(a.date||'')?-1:1; });
}

/* ═══════════════════════════════════════════════════════════════════════════
   3 · DIE RECHNUNG
   ---------------------------------------------------------------------------
   Ein Container laeuft zwei Monate ab Ankunft im Lager. Danach gibt es 10 %
   auf das eingesetzte Geld. Wer wieviel von diesen 10 % bekommt:

     · beide drin  → jeder bekommt 10 % auf SEINEN eigenen Einsatz
                     (= Gewinn im Verhaeltnis der Einsaetze)
     · nur Alex    → Alex 7 %, André 3 % (also 70/30 des Gewinns)
     · nur André   → alles André

   Jede Karte darf das ueberschreiben (Feld "Gewinn an Alex %") — für Faelle,
   die anders vereinbart waren.
   ═══════════════════════════════════════════════════════════════════════════ */
/* Die zwei Monate zaehlen NUR ab Ankunft im Lager. Das Bestelldatum ist kein
   Ersatz dafuer: solange der Container auf dem Schiff ist, laeuft keine Uhr
   ("unterwegs"), bis André das Ankunftsdatum eintraegt. */
function startDate(c){ return c.arrive || ''; }
function transit(c){ return !c.paid && !c.arrive && !c.due; }
function due(c){ return c.due || addM(startDate(c), c.months!=null&&c.months!==''?+c.months:cfg('months')); }

function calc(c){
  var a=num(c.invA), n=num(c.invN);
  var tot=a+n;
  var rate=(c.rate!=null&&c.rate!=='')?num(c.rate):cfg('rate');
  var profit=tot*rate/100;
  var sA;                                        // Anteil Alex am GEWINN (0..1)
  if(c.pctA!=null && c.pctA!=='') sA=num(c.pctA)/100;
  else if(a>0 && n>0)             sA=a/tot;      // beide → nach Einsatz
  else if(a>0)                    sA=cfg('soloAlex')/100;
  else                            sA=0;
  var pA=profit*sA, pN=profit-pA;
  var d=due(c), left=daysTo(d);
  var s=startDate(c), sn=dayNo(s), dn=dayNo(d), tn=dayNo(todayISO());
  var prog = (sn!=null&&dn!=null&&dn>sn) ? Math.max(0,Math.min(1,(tn-sn)/(dn-sn))) : (c.paid?1:0);
  return { invA:a, invN:n, tot:tot, rate:rate, profit:profit, shareA:sA,
           pA:pA, pN:pN, outA:a+pA, outN:n+pN, due:d, left:left, prog:prog,
           late: !c.paid && left!=null && left<0, way: transit(c) };
}

/* Alex' Kasse. Ich verwalte sein Geld, also muss die Seite jederzeit sagen
   koennen: wieviel liegt frei, wieviel steckt in Containern, wieviel hat er
   schon verdient. Eingezahlt − ausgezahlt − alle Einsaetze + alles, was aus
   fertigen Containern zurueckkam. */
function totals(){
  var t={ depo:0, wd:0, invA:0, invN:0, realA:0, realN:0, openA:0, openN:0,
          outA:0, outN:0, price:0, cntOpen:0, cntDone:0 };
  ledger().forEach(function(l){
    if(l.type==='out') t.wd+=num(l.amount); else t.depo+=num(l.amount);
  });
  var back=0, spent=0;
  list().forEach(function(c){
    var k=calc(c);
    t.price+=num(c.price);
    spent+=k.invA;
    if(c.paid){ t.cntDone++; t.realA+=k.pA; t.realN+=k.pN; back+=k.outA; }
    else{ t.cntOpen++; t.invA+=k.invA; t.invN+=k.invN; t.openA+=k.pA; t.openN+=k.pN;
          t.outA+=k.outA; t.outN+=k.outN; }
  });
  t.free = t.depo - t.wd - spent + back;
  t.kapA = t.free + t.invA;              // Alex' Vermoegen im System
  return t;
}

/* ═══════════════════════════════════════════════════════════════════════════
   3b · VERLAUF
   ---------------------------------------------------------------------------
   Ein Wert pro Tag, vom ersten Geld bis zur letzten Rueckzahlung:
     · Alex  = was er eingezahlt hat (minus Auszahlungen) + Gewinn bis dahin
     · André = nur der Gewinn (sein Einsatz steht nirgends vollstaendig drin)
   Gewinn zaehlt erst an dem Tag, an dem der Container das Geld zurueckbringt
   (exakt, als Treppe — André wollte es genau, nicht geglaettet). Offene
   Container stehen am Faelligkeitstag, blass. Unterwegs = noch kein Tag.
   Darunter der Zeitplan: alle Daten je Container auf einer Zeitachse.
   Euro: ein Kurs fuer alles, der von heute (EZB ueber frankfurter.dev).
   ═══════════════════════════════════════════════════════════════════════════ */
var CUR='thb';
try{ CUR=localStorage.getItem('kp-invest-cur')==='eur'?'eur':'thb'; }catch(e){}
var FX={ r:0.0266, d:'', live:false };            // Notnagel, falls offline
(function(){
  var fresh=false;
  try{
    var c=JSON.parse(localStorage.getItem('kp-invest-fx')||'null');
    if(c && c.r){ FX={ r:c.r, d:c.d, live:true }; fresh=(Date.now()-c.ts)<6*3600*1000; }
  }catch(e){}
  if(fresh || !window.fetch) return;
  fetch('https://api.frankfurter.dev/v1/latest?base=THB&symbols=EUR')
    .then(function(r){ return r.json(); })
    .then(function(j){
      var r=j && j.rates && +j.rates.EUR; if(!r) return;
      FX={ r:r, d:j.date||'', live:true };
      try{ localStorage.setItem('kp-invest-fx', JSON.stringify({ r:r, d:FX.d, ts:Date.now() })); }catch(e){}
      render();
    }).catch(function(){});
})();
function E0(v){ return NF0.format(Math.round((+v||0)*FX.r))+' €'; }
function cv(v){ return CUR==='eur' ? v*FX.r : v; }
function M(v){ return CUR==='eur' ? E0(v) : B0(v); }          // Hauptwaehrung
function M2(v){ return CUR==='eur' ? B0(v) : E0(v); }         // die andere, klein
/* Alex' Bild: 'gew' = nur der Gewinn (die Linie, die waechst), 'ges' = Einsatz
   mit Gewinn obendrauf. Neben 955k Einsatz waere der Gewinn sonst nur ein
   duenner Streifen. */
var AMODE='gew';
try{ AMODE=localStorage.getItem('kp-invest-amode')==='ges'?'ges':'gew'; }catch(e){}
function setAMode(m){ AMODE=m; try{ localStorage.setItem('kp-invest-amode',m); }catch(e){} render(); }
function setCur(c){ CUR=c; try{ localStorage.setItem('kp-invest-cur',c); }catch(e){} render(); }
function isoOf(n){ var d=new Date(n*86400000);
  return d.getUTCFullYear()+'-'+p2(d.getUTCMonth()+1)+'-'+p2(d.getUTCDate()); }

function curve(){
  var cap=[], ev=[], way=0, t=dayNo(todayISO());
  ledger().forEach(function(l){
    var d=dayNo(l.date); if(d==null) return;
    cap.push({ d:d, v:(l.type==='out'?-1:1)*num(l.amount) });
  });
  list().forEach(function(c){
    var k=calc(c);
    if(k.way) way++;
    /* Rueckzahlung: ausgezahlt → am echten Tag; offen → am Faelligkeitstag,
       ueberfaellig → ab heute erwartet; unterwegs → noch kein Tag bekannt. */
    var P = c.paid ? dayNo(c.paidDate||k.due) : dayNo(k.due);
    if(P!=null && !c.paid && P<t) P=t;
    ev.push({ c:c, k:k, od:dayNo(c.order)!=null?dayNo(c.order):dayNo(c.arrive),
              ad:dayNo(c.arrive), dd:dayNo(k.due), P:P, fut:!c.paid });
  });
  var all=cap.map(function(x){ return x.d; });
  ev.forEach(function(e){ if(e.od!=null) all.push(e.od); if(e.P!=null) all.push(e.P); });
  if(!all.length) return null;
  var d0=Math.min.apply(null, all)-4;
  var d1=Math.max.apply(null, all.concat([t]))+6;
  var C={ d0:d0, d1:d1, t:t, way:way, ev:ev.sort(function(a,b){ return (a.od||0)-(b.od||0); }),
          cap:[], pa:[], pn:[] };
  for(var d=d0; d<=d1; d++){
    var cc=0, a=0, n=0;
    cap.forEach(function(x){ if(x.d<=d) cc+=x.v; });
    ev.forEach(function(e){ if(e.P!=null && e.P<=d){ a+=e.k.pA; n+=e.k.pN; } });
    C.cap.push(cc); C.pa.push(a); C.pn.push(n);
  }
  return C;
}
function at(C,d){ return Math.max(0, Math.min(C.cap.length-1, d-C.d0)); }

/* Kopf + leere Flaeche. Gezeichnet wird erst, wenn die Breite bekannt ist. */
function chartBox(who, C){
  if(!C) return '';
  var i=at(C,C.t), j=C.cap.length-1, h='<div class="card">';
  var fut = who==='A' ? C.pa[j]>C.pa[i] : C.pn[j]>C.pn[i];
  var lastP=Math.max.apply(null, C.ev.map(function(e){ return e.P||0; }));
  var curBtns='<div class="cur"><button type="button" class="'+(CUR==='thb'?'on':'')+'" onclick="setCur(\'thb\')">฿</button>'
            + '<button type="button" class="'+(CUR==='eur'?'on':'')+'" onclick="setCur(\'eur\')">€</button></div>';
  if(who==='A'){
    var nowT=C.cap[i]+C.pa[i], endT=C.cap[j]+C.pa[j];
    h+='<div class="ch-head">'
      + '<div class="ch-hero"><div class="k">Alex heute</div><div class="v">'+M(nowT)+'</div>'
      +   '<div class="s">'+M2(nowT)+' · Gewinn ausgezahlt +'+M(C.pa[i])+'</div></div>'
      + (fut ? '<div class="ch-hero fut"><div class="k">Wenn alles zurück ist ('+shortDate(isoOf(lastP))+')</div>'
             +   '<div class="v">'+M(endT)+'</div><div class="s">Gewinn +'+M(C.pa[j])+'</div></div>' : '')
      + '<div class="cur" style="margin-left:auto"><button type="button" class="'+(AMODE==='gew'?'on':'')+'" onclick="setAMode(\'gew\')">Gewinn</button>'
      +   '<button type="button" class="'+(AMODE==='ges'?'on':'')+'" onclick="setAMode(\'ges\')">Mit Einsatz</button></div>'
      + curBtns.replace('class="cur"','class="cur" style="margin-left:0"') + '</div>';
  }else{
    h+='<div class="ch-head">'
      + '<div class="ch-hero"><div class="k">Dein Gewinn ausgezahlt</div><div class="v" style="color:var(--andre)">+'+M(C.pn[i])+'</div>'
      +   '<div class="s">+'+M2(C.pn[i])+'</div></div>'
      + (fut ? '<div class="ch-hero fut"><div class="k">Wenn alles zurück ist ('+shortDate(isoOf(lastP))+')</div>'
             +   '<div class="v">+'+M(C.pn[j])+'</div><div class="s">+'+M2(C.pn[j])+'</div></div>' : '')
      + curBtns + '</div>';
  }
  h+='<div class="chart" id="ch-'+who+'"></div>';
  var col = who==='A' ? 'var(--alex)' : 'var(--andre)';
  h+='<div class="leg" style="margin-top:8px">'
    + (who==='A' && AMODE==='ges' ? '<span><b style="background:#5A6274"></b>Eingezahlt</span>' : '')
    + '<span><b style="background:'+col+'"></b>Gewinn — springt am Tag, an dem das Geld zurückkommt</span>'
    + '<span><b style="background:transparent;border:2px solid '+col+';border-radius:50%"></b>noch offen</span></div>';
  h+='<div class="ch-note">'
    + (FX.live ? '1 € = '+NF2.format(1/FX.r)+' ฿ (EZB'+(FX.d?', '+deDate(FX.d):'')+')' : 'Euro grob geschätzt (1 € ≈ '+NF0.format(1/FX.r)+' ฿) — Kurs gerade nicht abrufbar')
    + (C.way ? ' · '+C.way+' Container unterwegs, kommt erst mit dem Ankunftsdatum dazu' : '')
    + '</div></div>';
  return h;
}

var MON=['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
function kfmt(v){
  var s=CUR==='eur'?'€':'฿', a=Math.abs(v);
  if(a>=1e6) return s+NF2.format(v/1e6).replace(/,?0+$/,'')+' Mio';
  if(a>=1e3) return s+NF0.format(Math.round(v/1e3))+'k';
  return s+NF0.format(Math.round(v));
}
/* Runde Gitterschritte (1-2-2,5-5), damit an der Achse 50k/100k steht und
   nicht 37,5k/113k. */
function niceStep(v){
  if(!(v>0)) return 1;
  var p=Math.pow(10, Math.floor(Math.log(v)/Math.LN10));
  return [1,2,2.5,5,10].find(function(m){ return m*p>=v; })*p;
}
function monthsIn(d0,d1){
  var out=[], d=new Date(d0*86400000);
  var m=new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth()+1, 1));
  while(m.getTime()/86400000<=d1){ out.push(m.getTime()/86400000); m=new Date(Date.UTC(m.getUTCFullYear(), m.getUTCMonth()+1, 1)); }
  return out;
}
function drawChart(who, C){
  var el=$('ch-'+who); if(!el || !C) return;
  var W=el.clientWidth; if(!W) return;                // Reiter versteckt → spaeter
  var H=W<500?230:280, pl=50, pr=14, pt=40, pb=22, pw=W-pl-pr, ph=H-pt-pb;
  var n=C.cap.length, ges=(who==='A' && AMODE==='ges');
  var pro = who==='A' ? C.pa : C.pn;
  var lo=[], hi=[];
  for(var i=0;i<n;i++){
    var b = ges ? cv(Math.max(0,C.cap[i])) : 0;
    lo.push(b); hi.push(b+cv(pro[i]));
  }
  var top=Math.max.apply(null, hi);
  var ystep=niceStep(top/4), ymax=Math.max(1, Math.ceil(top*1.04/ystep))*ystep, ng=Math.round(ymax/ystep);
  function X(i){ return pl + (n<2?0:i/(n-1))*pw; }
  function Y(v){ return pt + (1-v/ymax)*ph; }
  /* Treppe statt Schraege: der Wert springt genau an dem Tag, an dem das Geld kommt. */
  function pts(arr){
    var o=[[X(0),Y(arr[0])]];
    for(var i=1;i<n;i++) if(arr[i]!==arr[i-1]){ o.push([X(i),Y(arr[i-1])]); o.push([X(i),Y(arr[i])]); }
    o.push([X(n-1),Y(arr[n-1])]);
    return o;
  }
  function path(o){ return o.map(function(p,k){ return (k?'L':'M')+p[0].toFixed(1)+','+p[1].toFixed(1); }).join(''); }
  function band(topA,bot){ return path(pts(topA).concat(pts(bot).reverse()))+'Z'; }
  var tx=X(C.t-C.d0), zero=lo.map(function(){ return 0; });
  var col = who==='A' ? 'var(--alex)' : 'var(--andre)';
  var s='<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'">'
    + '<defs><clipPath id="cp-'+who+'-p"><rect x="0" y="0" width="'+tx+'" height="'+H+'"/></clipPath>'
    +       '<clipPath id="cp-'+who+'-f"><rect x="'+tx+'" y="0" width="'+(W-tx)+'" height="'+H+'"/></clipPath></defs>';
  for(var g=0; g<=ng; g++){                                   // Gitter + y-Beschriftung
    var gv=ystep*g, gy=Y(gv);
    s+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+gy+'" y2="'+gy+'" stroke="var(--edge)" stroke-width="1" '+(g?'stroke-dasharray="2 4"':'')+'/>'
     + '<text x="'+(pl-6)+'" y="'+(gy+3.5)+'" text-anchor="end">'+kfmt(gv)+'</text>';
  }
  monthsIn(C.d0,C.d1).forEach(function(md){                   // jeder Monat, mit Linie
    var mx=X(md-C.d0), mm=new Date(md*86400000).getUTCMonth();
    s+='<line x1="'+mx+'" x2="'+mx+'" y1="'+pt+'" y2="'+(H-pb+4)+'" stroke="var(--edge)" stroke-dasharray="1 5"/>'
     + '<text x="'+(mx+3)+'" y="'+(H-5)+'">'+MON[mm]+'</text>';
  });
  ['p','f'].forEach(function(part){
    s+='<g clip-path="url(#cp-'+who+'-'+part+')" opacity="'+(part==='p'?1:.45)+'">';
    if(ges){
      s+='<path d="'+band(lo,zero)+'" fill="#5A6274" fill-opacity=".55"/>'
       + '<path d="'+band(hi,lo)+'" fill="var(--alex)" fill-opacity=".35"/>'
       + '<path d="'+path(pts(lo))+'" fill="none" stroke="var(--panel)" stroke-width="2"/>';
    }else{
      s+='<path d="'+band(hi,zero)+'" fill="'+col+'" fill-opacity=".22"/>';
    }
    s+='<path d="'+path(pts(hi))+'" fill="none" stroke="'+col+'" stroke-width="2" stroke-linejoin="round"'
     + (part==='f'?' stroke-dasharray="5 4"':'')+'/></g>';
  });
  s+='<line x1="'+tx+'" x2="'+tx+'" y1="'+(pt-6)+'" y2="'+(H-pb)+'" stroke="var(--ink3)" stroke-dasharray="3 3"/>'
   + '<text x="'+tx+'" y="'+(pt-10)+'" text-anchor="middle" style="fill:var(--ink2)">heute</text>';

  /* Jede Rueckzahlung ein Punkt, beschriftet mit Container und Betrag. Labels,
     die sich ueberlappen wuerden, fallen weg — der Tooltip hat sie trotzdem. */
  var mine=C.ev.filter(function(e){ return e.P!=null && (who==='A'?e.k.pA:e.k.pN)>0.5; });
  /* Platz suchen: ueber dem Punkt, eine Etage hoeher, links, rechts — erste
     Stelle, die keinen anderen Text ueberdeckt. Die Kaestchen sind grob
     geschaetzt (Breite nach Zeichenzahl), das reicht. */
  var boxes=[[tx-20, pt-22, tx+20, pt-6]];                    // "heute"
  function free(b){ return b[1]>=0 && b[0]>=0 && b[2]<=W && !boxes.some(function(o){
    return b[0]<o[2]+4 && b[2]>o[0]-4 && b[1]<o[3]+2 && b[3]>o[1]-2; }); }
  mine.forEach(function(e){
    var ix=at(C,e.P), x=X(ix), y=Y(hi[ix]);
    s+='<circle cx="'+x+'" cy="'+y+'" r="4.5" fill="'+(e.fut?'var(--panel)':col)+'" stroke="'+col+'" stroke-width="2"/>';
    var nm=String(e.c.name||'Container'); if(nm.length>14) nm=nm.slice(0,13)+'…';
    var val='+'+M(who==='A'?e.k.pA:e.k.pN);
    var bw=Math.max(nm.length*5.6, val.length*6.6)+4, bh=24;
    var tries=[ ['middle', x, y-8], ['middle', x, y-34], ['end', x-9, y+10], ['start', x+9, y+10],
                ['end', x-9, y-8], ['start', x+9, y-8], ['middle', x, y+34] ];
    for(var q=0;q<tries.length;q++){
      var a=tries[q][0], lx=tries[q][1], by=tries[q][2];
      var x0 = a==='middle' ? lx-bw/2 : a==='end' ? lx-bw : lx;
      if(x0<2){ x0=2; a='start'; lx=2; } else if(x0+bw>W-2){ x0=W-2-bw; a='end'; lx=W-2; }
      var b=[x0, by-bh, x0+bw, by];
      if(free(b)){
        boxes.push(b);
        s+='<text class="lbl" x="'+lx+'" y="'+(by-13)+'" text-anchor="'+a+'">'+esc(nm)+'</text>'
         + '<text class="lbl v" x="'+lx+'" y="'+(by-1)+'" text-anchor="'+a+'">'+val+'</text>';
        break;
      }
    }
  });
  s+='<line id="gl-'+who+'" y1="'+pt+'" y2="'+(H-pb)+'" stroke="var(--ink2)" stroke-width="1" style="display:none"/>'
   + '<circle id="gd-'+who+'" r="5" fill="'+col+'" stroke="var(--panel)" stroke-width="2" style="display:none"/>'
   + '</svg><div class="ch-tip" id="tt-'+who+'"></div>';
  el.innerHTML=s;

  function hide(){ ['gl-','gd-','tt-'].forEach(function(p){ var e=$(p+who); if(e) e.style.display='none'; }); }
  function show(ev){
    var r=el.getBoundingClientRect(), x=ev.clientX-r.left;
    if(x<pl-8 || x>W-pr+8){ hide(); return; }
    var i=Math.round(Math.max(0,Math.min(1,(x-pl)/pw))*(n-1));
    /* In der Naehe einer Rueckzahlung: auf genau diesen Tag einrasten. */
    var best=null;
    mine.forEach(function(e){ var ex=X(at(C,e.P)); if(Math.abs(ex-x)<16 && (!best || Math.abs(ex-x)<best.dx)) best={i:at(C,e.P),dx:Math.abs(ex-x)}; });
    if(best) i=best.i;
    var xi=X(i), dd=C.d0+i;
    var gl=$('gl-'+who), gd=$('gd-'+who), tt=$('tt-'+who);
    gl.setAttribute('x1',xi); gl.setAttribute('x2',xi); gl.style.display='';
    gd.setAttribute('cx',xi); gd.setAttribute('cy',Y(hi[i])); gd.style.display='';
    var rows = who==='A'
      ? (ges ? '<div class="r"><span>Eingezahlt</span><b>'+M(C.cap[i])+'</b></div>' : '')
      + '<div class="r"><span>Gewinn bis hier</span><b>+'+M(C.pa[i])+'</b></div>'
      + (ges ? '<div class="r"><span>Gesamt</span><b>'+M(C.cap[i]+C.pa[i])+'</b></div>' : '')
      : '<div class="r"><span>Gewinn bis hier</span><b>+'+M(C.pn[i])+'</b></div>';
    var evs=mine.filter(function(e){ return e.P===dd; }).map(function(e){
      var inv=who==='A'?e.k.invA:e.k.invN, p=who==='A'?e.k.pA:e.k.pN;
      return '<div class="ev"><b>'+esc(e.c.name||'Container')+'</b> '+(e.fut?'fällig':'zurück')+'<br>'
        + (inv>0 ? 'Einsatz '+M(inv)+' + Gewinn '+M(p)+'<br>= <b>'+M(inv+p)+'</b>' : 'Gewinn <b>+'+M(p)+'</b>')
        + '</div>';
    }).join('');
    tt.innerHTML='<div class="d">'+deDate(isoOf(dd))+(dd>C.t?' · erwartet':'')+'</div>'+rows+evs;
    tt.style.display='block';
    var tw=tt.offsetWidth||180;
    tt.style.left = (xi+12+tw > W ? Math.max(0, xi-12-tw) : xi+12)+'px';
  }
  el.onpointermove=show; el.onpointerdown=show; el.onpointerleave=hide;
}

/* Zeitplan: ein Balken je Container. Bezahlt (Quadrat) → unterwegs (schraffiert)
   → Ankunft → laeuft 2 Monate (blau, gruen wenn erledigt) → Geld zurueck
   (gruener Punkt) bzw. faellig (offener Ring). Darunter alle Daten als Text. */
function ganttHtml(C){
  if(!C || !C.ev.length) return '';
  var span=Math.max(1, C.d1-C.d0), t=C.t;
  function P(d){ return Math.max(0, Math.min(100, (d-C.d0)/span*100)).toFixed(2)+'%'; }
  function Wd(a,b){ return Math.max(0.6, (b-a)/span*100).toFixed(2)+'%'; }
  var h='<div class="card"><div class="leg" style="margin-bottom:12px">'
    + '<span><b style="background:var(--ink2);border-radius:2px"></b>bezahlt</span>'
    + '<span><b style="background:repeating-linear-gradient(135deg,rgba(185,164,255,.8) 0 3px,rgba(185,164,255,.2) 3px 6px)"></b>unterwegs</span>'
    + '<span><b style="background:var(--blue)"></b>läuft</span>'
    + '<span><b style="background:var(--andre)"></b>erledigt</span>'
    + '<span><b style="background:var(--andre);border-radius:50%"></b>Geld zurück</span>'
    + '<span><b style="background:transparent;border:2px solid var(--blue);border-radius:50%"></b>fällig</span></div>';
  h+='<div class="gx">';
  monthsIn(C.d0,C.d1).forEach(function(md){ h+='<span style="left:'+P(md)+'">'+MON[new Date(md*86400000).getUTCMonth()]+'</span>'; });
  h+='</div>';
  C.ev.forEach(function(e){
    var c=e.c, k=e.k, od=e.od, ad=e.ad, dd=e.dd, bars='';
    if(od!=null){
      var wayEnd = ad!=null ? ad : t;
      if(wayEnd>od) bars+='<i class="g-way" style="left:'+P(od)+';width:'+Wd(od,wayEnd)+'"></i>';
    }
    if(ad!=null){
      var runEnd = e.P!=null ? e.P : (dd!=null ? dd : t);
      bars+='<i class="'+(c.paid?'g-dn':'g-run')+'" style="left:'+P(ad)+';width:'+Wd(ad,runEnd)+'"></i>';
    }
    bars+='<div class="g-t" style="left:'+P(t)+'"></div>';
    if(od!=null) bars+='<div class="g-s" style="left:'+P(od)+'"></div>';
    if(e.P!=null) bars+='<div class="g-e '+(c.paid?'ok':'op')+'" style="left:'+P(e.P)+'"></div>';

    var inv=k.invA+k.invN, out=k.outA+k.outN;
    var ppl = (k.invA>0?'Alex '+B0(k.invA):'') + (k.invA>0&&k.invN>0?' · ':'') + (k.invN>0?'André '+B0(k.invN):'');
    var dates = '<em>bezahlt</em> '+(c.order?shortDate(c.order):'—')
      + ' → <em>Ankunft</em> '+(c.arrive?shortDate(c.arrive):'unterwegs')
      + ' → <em>fällig</em> '+(k.due?shortDate(k.due):'—')
      + (c.paid ? ' → <em>zurück</em> '+shortDate(c.paidDate||k.due) : '')
      + ' · <em>'+(c.paid?'kam zurück':'kommt zurück')+'</em> '+B0(out)+' <em>(+'+B0(out-inv)+')</em>';
    h+='<div class="gr"><div class="gn"><b>'+esc(c.name||'Container')+'</b><span>'+ppl+'</span></div>'
      + '<div class="gt">'+bars+'</div>'
      + '<div class="gd">'+dates+'</div></div>';
  });
  return h+'</div>';
}
var CURV=null;
function drawCharts(){ drawChart('A',CURV); drawChart('N',CURV); }
var _rz;
window.addEventListener('resize', function(){ clearTimeout(_rz); _rz=setTimeout(drawCharts,150); });

/* ═══════════════════════════════════════════════════════════════════════════
   4 · ANSICHT · ÜBERSICHT
   ═══════════════════════════════════════════════════════════════════════════ */
function tile(cls,k,v,s){
  return '<div class="tile '+(cls||'')+'"><div class="k">'+k+'</div><div class="v">'+v+'</div>'
       + (s?'<div class="s">'+s+'</div>':'')+'</div>';
}
function renderOver(){
  var t=totals(), L=list(), open=L.filter(function(c){ return !c.paid; });
  var h='';
  CURV=curve();

  /* Alex zuerst — sein Geld verwalte ich, also ist das die Zahl, die zaehlt. */
  h+='<div class="sec"><h2 style="color:var(--alex)">Alex</h2><div class="line"></div></div>';
  h+='<div class="tiles g5">'
    + tile('a','Eingezahlt', '<span class="va">'+B0(t.depo)+'</span>',
            t.wd>0 ? ('davon '+B0(t.wd)+' zurück ausgezahlt') : 'in '+ledger().filter(function(l){return l.type!=='out';}).length+' Überweisungen')
    + tile('a','In Containern', B0(t.invA), t.cntOpen+' laufend')
    + tile('a','Frei verfügbar', '<span class="'+(t.free<0?'vr':'')+'">'+B0(t.free)+'</span>',
            t.free<0 ? 'überzogen — mehr investiert als da' : 'nicht investiert')
    + tile('a','Gewinn realisiert', '<span class="vn">+'+B0(t.realA)+'</span>', t.cntDone+' ausgezahlt')
    + tile('a','Gewinn offen', '+'+B0(t.openA), 'wird noch fällig')
    + '</div>';

  /* Wo liegt das Geld gerade — ein Balken sagt das schneller als drei Zahlen. */
  var base=Math.max(1, Math.max(0,t.free)+t.invA);
  h+='<div class="card">'
    + '<div class="stack">'
    +   '<i style="width:'+(Math.max(0,t.free)/base*100)+'%;background:linear-gradient(180deg,#454C5D,#363C4B)"></i>'
    +   '<i style="width:'+(t.invA/base*100)+'%;background:linear-gradient(180deg,var(--alex),var(--alexD))"></i>'
    + '</div>'
    + '<div class="leg">'
    +   '<span><b style="background:#454C5D"></b>Frei '+B0(Math.max(0,t.free))+'</span>'
    +   '<span><b style="background:var(--alex)"></b>Investiert '+B0(t.invA)+'</span>'
    +   '<span style="margin-left:auto;color:var(--ink2)">Vermögen gesamt <b style="background:none;width:auto;font-weight:700;color:var(--ink)" class="n">'+B0(t.kapA)+'</b></span>'
    + '</div></div>';
  h+=chartBox('A',CURV);

  h+='<div class="sec"><h2 style="color:var(--andre)">André</h2><div class="line"></div></div>';
  h+='<div class="tiles g3">'
    + tile('n','In Containern', B0(t.invN), t.cntOpen+' laufend')
    + tile('n','Gewinn realisiert', '<span class="vn">+'+B0(t.realN)+'</span>', t.cntDone+' abgeschlossen')
    + tile('n','Gewinn offen', '+'+B0(t.openN), 'wird noch fällig')
    + '</div>';
  h+=chartBox('N',CURV);

  h+='<div class="sec"><h2>Zeitplan der Container</h2><div class="line"></div>'
    + '<span class="muted">bezahlt → Ankunft → Geld zurück</span></div>';
  h+=ganttHtml(CURV);

  /* Wann kommt was zurueck. Das ist der eigentliche Grund für die Seite. */
  h+='<div class="sec"><h2>Nächste Auszahlungen</h2><div class="line"></div>'
    + '<span class="muted">'+open.length+' offen</span></div>';
  if(!open.length){
    h+='<div class="empty">Gerade läuft kein Container.</div>';
  }else{
    h+='<div class="card"><div class="tl">';
    open.forEach(function(c,i){
      var k=calc(c);
      var lab = k.way        ? 'noch unterwegs'
              : k.left==null ? 'Datum fehlt'
              : k.left<0     ? Math.abs(k.left)+' Tage überfällig'
              : k.left===0   ? 'heute fällig'
              : 'in '+k.left+' Tagen';
      h+='<div class="tlr">'
        +  '<div class="d">'+(k.way?'Ankunft + 2 Mon.':deDate(k.due))+'<em>'+lab+'</em></div>'
        +  '<div><div class="nm">'+esc(c.name||'Container')+'</div>'
        +    '<div class="mini"><i class="'+(k.late?'late':'')+'" style="width:'+(k.prog*100).toFixed(1)+'%"></i></div></div>'
        +  '<div class="amt">'
        +    (i===0 ? '<span class="h"></span><span class="h">Einsatz</span><span class="h">Gewinn</span><span class="h">Auszahlung</span>' : '')
        +    '<span class="pn" style="color:var(--alex)">Alex</span>'
        +      '<span>'+B0(k.invA)+'</span>'
        +      '<span style="color:var(--alex)">+'+B0(k.pA)+'</span>'
        +      '<span class="tot">'+B0(k.outA)+'</span>'
        +    '<span class="pn" style="color:var(--andre)">André</span>'
        +      '<span>'+B0(k.invN)+'</span>'
        +      '<span style="color:var(--andre)">+'+B0(k.pN)+'</span>'
        +      '<span class="tot">'+B0(k.outN)+'</span>'
        +  '</div>'
        + '</div>';
    });
    h+='</div></div>';
  }

  /* Summe unten drunter, damit man das Gesamtbild einmal sieht. */
  h+='<div class="sec"><h2>Gesamt</h2><div class="line"></div></div>';
  h+='<div class="tiles g3">'
    + tile('','Container gesamt', NF0.format(L.length), t.cntOpen+' laufend · '+t.cntDone+' abgeschlossen')
    + tile('','Kapital im Umlauf', B0(t.invA+t.invN), 'Alex '+B0(t.invA)+' · André '+B0(t.invN))
    + tile('','Gewinn gesamt', '<span class="vn">+'+B0(t.realA+t.realN+t.openA+t.openN)+'</span>',
            'realisiert '+B0(t.realA+t.realN)+' · offen '+B0(t.openA+t.openN))
    + '</div>';

  $('v-over').innerHTML=h;
  drawCharts();
}

function renderCont(){
  var L=list(), h='';
  if(!L.length){
    h+='<div class="sec"><h2>Container</h2><div class="line"></div>'
      + (canEdit()?'<button type="button" class="ghost" onclick="openC()">+ Neuer Container</button>':'')+'</div>'
      + '<div class="empty">Noch nichts eingetragen.'
      + (canEdit()?'<br><br><button type="button" class="ghost" onclick="openC()">Ersten Container anlegen</button>':'')
      + '</div>';
    $('v-cont').innerHTML=h; return;
  }
  /* Was laeuft, gehoert nach oben; was durch ist, ist Archiv. Gemischt hat man
     beim Runterscrollen nie gewusst, ob die Karte noch Geld bindet. */
  h+=group('Läuft', L.filter(function(c){ return !c.paid; }), true)
   + group('Ausgezahlt', L.filter(function(c){ return c.paid; }), false);
  $('v-cont').innerHTML=h;
}
function group(title, L, withAdd){
  var h='<div class="sec"><h2>'+title+'</h2><div class="line"></div>'
    + '<span class="muted">'+L.length+'</span>'
    + (withAdd && canEdit() ? '<button type="button" class="ghost" onclick="openC()">+ Neuer Container</button>' : '')
    + '</div>';
  if(!L.length) return h+'<div class="empty">'+(withAdd?'Gerade läuft kein Container.':'Noch nichts abgeschlossen.')+'</div>';
  h+='<div class="cgrid">';
  L.forEach(function(c){
    var k=calc(c);
    var st = c.paid ? ['p-done','Ausgezahlt']
           : k.way  ? ['p-way','Unterwegs']
           : k.late ? ['p-late','Überfällig']
           : (k.left!=null && k.left<=14) ? ['p-soon','in '+k.left+' T.']
           : ['p-run','Läuft'];
    var wA = k.tot>0 ? (k.invA/k.tot*100) : 0;
    h+='<div class="cc'+(c.paid?' done':'')+(k.late?' late':'')+'">'
      + '<div class="top"><div style="flex:1">'
      +   '<div class="nm">'+esc(c.name||'Container')+'</div>'
      +   '<div class="dt">'+(k.way ? 'Bestellt '+deDate(c.order)+' · noch unterwegs'
                                    : 'Ankunft '+deDate(startDate(c))+' → fällig '+deDate(k.due))+'</div>'
      + '</div><span class="pill '+st[0]+'">'+st[1]+'</span></div>'

      + '<div class="price">'+B0(c.price||k.tot)+'<small>Kaufpreis</small></div>'

      + '<div class="split">'
      +   '<i style="width:'+wA.toFixed(1)+'%;background:linear-gradient(90deg,var(--alexD),var(--alex))"></i>'
      +   '<i style="width:'+(100-wA).toFixed(1)+'%;background:linear-gradient(90deg,var(--andre),var(--andreD))"></i>'
      + '</div>'
      + '<div class="splitlab"><span style="color:var(--alex)">Alex '+(wA?pct(wA):'—')+'</span>'
      +   '<span style="color:var(--andre)">André '+((100-wA)?pct(100-wA):'—')+'</span></div>'

      + '<div class="kv">'
      +   '<div class="h"></div><div class="h" style="text-align:right;color:var(--alex)">Alex</div><div class="h" style="text-align:right;color:var(--andre)">André</div>'
      +   '<div class="l">Einsatz</div><div class="x n">'+B0(k.invA)+'</div><div class="x n">'+B0(k.invN)+'</div>'
      +   '<div class="l">Gewinn '+NF0.format(k.rate)+'%</div>'
      +     '<div class="x n" style="color:var(--alex)">+'+B0(k.pA)+'</div>'
      +     '<div class="x n" style="color:var(--andre)">+'+B0(k.pN)+'</div>'
      +   '<div class="l" style="color:var(--ink);font-weight:650;padding-top:5px">Auszahlung</div>'
      +     '<div class="x n" style="padding-top:5px;color:var(--alex)">'+B0(k.outA)+'</div>'
      +     '<div class="x n" style="padding-top:5px;color:var(--andre)">'+B0(k.outN)+'</div>'
      + '</div>';

    if(k.way){
      h+='<div class="prog"><div class="t" style="margin-top:9px"><span>Die 2 Monate starten mit der Ankunft im Lager</span></div></div>';
    }else if(!c.paid){
      h+='<div class="prog"><div class="bar"><i class="'+(k.late?'late':'')+'" style="width:'+(k.prog*100).toFixed(1)+'%"></i></div>'
        + '<div class="t"><span>'+shortDate(startDate(c))+'</span>'
        +   '<span>'+(k.left==null?'':(k.left<0?Math.abs(k.left)+' Tage über':k.left+' Tage'))+'</span>'
        +   '<span>'+shortDate(k.due)+'</span></div></div>';
    }else if(c.paidDate){
      h+='<div class="prog"><div class="t" style="margin-top:9px"><span>Ausgezahlt am '+deDate(c.paidDate)+'</span></div></div>';
    }

    if(canEdit()){
      h+='<div class="acts">'
        + '<button type="button" onclick="openC(\''+c.id+'\')">Bearbeiten</button>'
        + (c.paid ? '<button type="button" onclick="unpay(\''+c.id+'\')">Zurücknehmen</button>'
           : k.way ? '<button type="button" class="go" onclick="arrived(\''+c.id+'\')">Angekommen ✓</button>'
                  : '<button type="button" class="go" onclick="pay(\''+c.id+'\')">Ausgezahlt ✓</button>')
        + '<button type="button" class="dl" title="Löschen" onclick="delC(\''+c.id+'\')">✕</button>'
        + '</div>';
    }
    h+='</div>';
  });
  return h+'</div>';
}

/* ═══════════════════════════════════════════════════════════════════════════
   6 · ANSICHT · ALEX KONTO
   Ein Kontoauszug: Einzahlungen und Auszahlungen von Hand, die Container-
   Bewegungen kommen automatisch dazu — sonst muesste man alles doppelt
   pflegen und die Salden wuerden auseinanderlaufen.
   ═══════════════════════════════════════════════════════════════════════════ */
function renderAcct(){
  var t=totals(), h='';
  h+='<div class="tiles g3">'
    + tile('a','Eingezahlt', '<span class="va">'+B(t.depo)+'</span>')
    + tile('a','An Alex ausgezahlt', t.wd?('−'+B(t.wd)):B(0))
    + tile('a','Frei verfügbar', '<span class="'+(t.free<0?'vr':'')+'">'+B(t.free)+'</span>', 'Rest liegt in Containern')
    + '</div>';

  h+='<div class="sec"><h2>Überweisungen</h2><div class="line"></div>'
    + (canEdit()?'<button type="button" class="ghost" onclick="openL()">+ Buchung</button>':'')+'</div>';

  var LG=ledger();
  if(!LG.length){
    h+='<div class="empty">Keine Überweisungen eingetragen.</div>';
  }else{
    h+='<div class="card"><table class="t-tx"><thead><tr><th>Datum</th><th>Art</th><th>Notiz</th>'
      + '<th class="r">Betrag</th>'+(canEdit()?'<th></th>':'')+'</tr></thead><tbody>';
    LG.forEach(function(l){
      var out=l.type==='out';
      h+='<tr><td class="n">'+deDate(l.date)+'</td>'
        + '<td><span class="tag '+(out?'t-out':'t-in')+'">'+(out?'Auszahlung':'Einzahlung')+'</span></td>'
        + '<td class="muted">'+esc(l.note||'')+'</td>'
        + '<td class="r n" style="font-weight:700;color:'+(out?'var(--red)':'var(--andre)')+'">'
        +   (out?'−':'+')+B(l.amount)+'</td>'
        + (canEdit()?'<td class="r"><button class="xdel" onclick="delL(\''+l.id+'\')">✕</button></td>':'')
        + '</tr>';
    });
    h+='</tbody></table></div>';
  }

  /* Der komplette Fluss, chronologisch, mit laufendem Saldo. Damit man sieht,
     ob zu irgendeinem Zeitpunkt mehr investiert war als da war. */
  var flow=[];
  LG.forEach(function(l){
    flow.push({ d:l.date, k:l.type==='out'?'out':'in', t:l.type==='out'?'Auszahlung an Alex':'Einzahlung von Alex',
                v:(l.type==='out'?-1:1)*num(l.amount), note:l.note||'' });
  });
  list().forEach(function(c){
    var k=calc(c);
    if(k.invA>0) flow.push({ d:startDate(c)||c.order, k:'inv', t:'Einsatz · '+(c.name||'Container'), v:-k.invA, note:'' });
    if(c.paid)   flow.push({ d:c.paidDate||k.due, k:'pay', t:'Rückzahlung · '+(c.name||'Container'),
                             v:k.outA, note:'Einsatz '+B0(k.invA)+' + Gewinn '+B0(k.pA) });
  });
  flow.sort(function(a,b){ return (a.d||'')<(b.d||'')?-1:(a.d||'')>(b.d||'')?1:0; });

  h+='<div class="sec"><h2>Kontoverlauf</h2><div class="line"></div>'
    + '<span class="muted">Überweisungen + Container</span></div>';
  if(!flow.length){
    h+='<div class="empty">Noch keine Bewegungen.</div>';
  }else{
    /* Der Saldo muss vorwaerts gerechnet werden, angezeigt wird aber rueckwaerts —
       das Neueste oben. Also erst durchrechnen, dann umdrehen. */
    var run=0;
    flow.forEach(function(f){ run+=f.v; f.bal=run; });
    h+='<div class="card"><table class="t-flow"><thead><tr><th>Datum</th><th>Vorgang</th>'
      + '<th class="r">Betrag</th><th class="r">Saldo frei</th></tr></thead><tbody>';
    flow.slice().reverse().forEach(function(f){
      var cls={in:'t-in',out:'t-out',inv:'t-inv',pay:'t-pay'}[f.k];
      h+='<tr><td class="n" style="white-space:nowrap">'+deDate(f.d)+'</td>'
        + '<td><span class="tag '+cls+'">'+esc(f.t)+'</span>'
        +   (f.note?'<div class="muted" style="margin-top:3px;font-size:11.5px">'+esc(f.note)+'</div>':'')+'</td>'
        + '<td class="r n" style="color:'+(f.v<0?'var(--ink2)':'var(--andre)')+'">'+(f.v<0?'−':'+')+B0(Math.abs(f.v))+'</td>'
        + '<td class="r n" style="font-weight:700;color:'+(f.bal<-0.5?'var(--red)':'var(--ink)')+'">'+B0(f.bal)+'</td></tr>';
    });
    h+='</tbody></table>'
      + (Math.min.apply(null, flow.map(function(f){ return f.bal; })) < -0.5
          ? '<div class="muted" style="margin-top:10px;color:var(--amber)">Der Saldo rutscht zwischendurch ins Minus — dann war zeitweise mehr investiert, als von Alex da war. Prüf die Daten oder trag die fehlende Einzahlung nach.</div>' : '')
      + '</div>';
  }
  $('v-acct').innerHTML=h;
}

function closeM(){ $('mask').innerHTML=''; $('mask').style.display='none'; document.body.style.overflow=''; }
function showM(html){
  $('mask').innerHTML='<div class="mask" onclick="if(event.target===this)closeM()"><div class="modal">'+html+'</div></div>';
  $('mask').style.display='';
  document.body.style.overflow='hidden';
}

var editId=null;
function openC(id){
  if(!canEdit()) return;
  editId=id||null;
  var c=id?(CTS[id]||{}):{};
  var nextNo='Container '+(Object.keys(CTS).length+1);
  var h='<h3>'+(id?'Container bearbeiten':'Neuer Container')+'</h3>'
   + '<div class="hint">Zwei Monate ab Ankunft im Lager, danach '+cfg('rate')+' % auf den Einsatz.</div>'
   + '<div class="frow"><div><label>Name</label>'
   +   '<input id="f-name" value="'+esc(c.name||nextNo)+'"></div>'
   +   '<div><label>Kaufpreis ฿</label><input class="n" id="f-price" value="'+(c.price!=null?NF2.format(num(c.price)):'')+'" placeholder="450.000"></div></div>'
   + '<div class="frow"><div><label>Bestelldatum</label><input type="date" id="f-order" value="'+esc(c.order||'')+'"></div>'
   +   '<div><label>Ankunft Lager</label><input type="date" id="f-arr" value="'+esc(c.arrive||'')+'"></div></div>'
   + '<div class="frow"><div><label style="color:var(--alex)">Einsatz Alex ฿</label>'
   +   '<input class="n" id="f-ia" value="'+(c.invA!=null?NF2.format(num(c.invA)):'')+'"></div>'
   +   '<div><label style="color:var(--andre)">Einsatz André ฿</label>'
   +   '<input class="n" id="f-in" value="'+(c.invN!=null?NF2.format(num(c.invN)):'')+'"></div></div>'
   + '<div class="half" style="margin:-4px 0 12px">'
   +   '<button type="button" onclick="fillSplit(50)">50 / 50 aus Kaufpreis</button>'
   +   '<button type="button" onclick="fillSplit(100)">Alex allein</button>'
   +   '<button type="button" onclick="fillSplit(0)">André allein</button></div>'
   + '<div class="frow"><div><label>Rendite %</label>'
   +   '<input class="n" id="f-rate" value="'+(c.rate!=null&&c.rate!==''?c.rate:'')+'" placeholder="'+cfg('rate')+'"></div>'
   +   '<div><label>Gewinn an Alex % <span style="text-transform:none;letter-spacing:0">(leer = automatisch)</span></label>'
   +   '<input class="n" id="f-pa" value="'+(c.pctA!=null&&c.pctA!==''?c.pctA:'')+'" placeholder="auto"></div></div>'
   + '<div class="frow"><div><label>Fällig am <span style="text-transform:none;letter-spacing:0">(leer = +'+cfg('months')+' Mon.)</span></label>'
   +   '<input type="date" id="f-due" value="'+esc(c.due||'')+'"></div>'
   +   '<div><label>Status</label><select id="f-paid">'
   +     '<option value="">läuft</option><option value="1"'+(c.paid?' selected':'')+'>ausgezahlt</option></select></div></div>'
   + '<div class="pv" id="f-pv"></div>'
   + '<div class="mact"><button class="cancel" onclick="closeM()">Abbrechen</button>'
   +   '<button class="save" onclick="saveC()">Speichern</button></div>';

  ['f-price','f-ia','f-in','f-rate','f-pa','f-order','f-arr','f-due'].forEach(function(id){
    var e=$(id); if(e) e.addEventListener('input', preview);
  });
  preview();

/* Die drei Knöpfe nehmen einem das Rechnen ab: Kaufpreis rein, Aufteilung
   klicken, fertig. */
function fillSplit(alexPct){
  var p=num($('f-price').value);
  if(!p){ say('Erst den Kaufpreis eintragen.'); return; }
  $('f-ia').value=NF2.format(p*alexPct/100);
  $('f-in').value=NF2.format(p*(100-alexPct)/100);
  preview();
}
function preview(){
  var c={ price:num($('f-price').value), invA:num($('f-ia').value), invN:num($('f-in').value),
          rate:$('f-rate').value, pctA:$('f-pa').value,
          order:$('f-order').value, arrive:$('f-arr').value, due:$('f-due').value };
  var k=calc(c);
  var mode = (k.invA>0&&k.invN>0) ? 'beide investiert → Gewinn nach Einsatz'
           : k.invA>0 ? ('Alex allein → '+NF0.format(k.shareA*100)+' / '+NF0.format(100-k.shareA*100))
           : k.invN>0 ? 'André allein' : '—';
  if(c.pctA!=='' && c.pctA!=null) mode='von Hand: Alex '+NF0.format(num(c.pctA))+' %';
  $('f-pv').innerHTML='<div class="hd">Vorschau · '+esc(mode)+'</div>'
    + '<div class="r"><span>Fällig am</span><b>'+(k.way?'noch unterwegs – ab Ankunft + 2 Mon.':deDate(k.due))+'</b></div>'
    + '<div class="r"><span>Gewinn gesamt ('+NF0.format(k.rate)+' %)</span><b>'+B(k.profit)+'</b></div>'
    + '<div class="r"><span style="color:var(--alex)">Auszahlung Alex</span><b style="color:var(--alex)">'+B(k.outA)+'</b></div>'
    + '<div class="r"><span style="color:var(--andre)">Auszahlung André</span><b style="color:var(--andre)">'+B(k.outN)+'</b></div>';
}
function saveC(){
  var rec={
    name:  $('f-name').value.trim() || 'Container',
    price: num($('f-price').value),
    order: $('f-order').value || '',
    arrive:$('f-arr').value || '',
    invA:  num($('f-ia').value),
    invN:  num($('f-in').value),
    rate:  $('f-rate').value===''?'':num($('f-rate').value),
    pctA:  $('f-pa').value===''?'':num($('f-pa').value),
    due:   $('f-due').value || '',
    paid:  $('f-paid').value==='1'
  };
  if(!rec.arrive && !rec.order){ say('Ohne Datum kann ich nichts ausrechnen.'); return; }
  if(rec.invA<=0 && rec.invN<=0){ say('Mindestens ein Einsatz muss drinstehen.'); return; }
  var id=editId||uid();
  var old=CTS[id]||{};
  if(rec.paid) rec.paidDate = old.paidDate || due(rec) || todayISO();
  rec.ts = old.ts || Date.now();
  IDB.ref('containers/'+id).set(rec).then(function(){ say(editId?'Gespeichert.':'Container angelegt.'); })
     .catch(oops);
  closeM();
}
function pay(id){
  var c=CTS[id]; if(!c) return;
  var k=calc(c);
  var d=prompt('Ausgezahlt am (TT.MM.JJJJ):', deDate(k.due===''?todayISO():k.due));
  if(d==null) return;
  var p=String(d).trim().split('.');
  var iso = p.length===3 ? (p[2].padStart(4,'20')+'-'+p2(+p[1])+'-'+p2(+p[0])) : todayISO();
  IDB.ref('containers/'+id).update({ paid:true, paidDate:iso })
     .then(function(){ say('Als ausgezahlt vermerkt.'); }).catch(oops);
}
/* Container ist im Lager: ab hier laufen die zwei Monate. */
function arrived(id){
  var c=CTS[id]; if(!c) return;
  var d=prompt('Angekommen im Lager am (TT.MM.JJJJ):', deDate(todayISO()));
  if(d==null) return;
  var p=String(d).trim().split('.');
  var iso = p.length===3 ? (p[2].padStart(4,'20')+'-'+p2(+p[1])+'-'+p2(+p[0])) : todayISO();
  IDB.ref('containers/'+id).update({ arrive:iso })
     .then(function(){ say('Ankunft eingetragen – fällig am '+deDate(addM(iso,cfg('months')))+'.'); }).catch(oops);
}
function unpay(id){
  IDB.ref('containers/'+id).update({ paid:false, paidDate:null })

function delC(id){

/* ── Buchung (Alex → André oder zurück) ──────────────────────────────────── */
function openL(){
  if(!canEdit()) return;
  showM('<h3>Buchung</h3><div class="hint">Geld von Alex an dich – oder von dir zurück an Alex.</div>'
   + '<div class="frow"><div><label>Datum</label><input type="date" id="l-date" value="'+todayISO()+'"></div>'
   +   '<div><label>Art</label><select id="l-type">'
   +     '<option value="in">Einzahlung von Alex</option>'
   +     '<option value="out">Auszahlung an Alex</option></select></div></div>'
   + '<div class="frow one"><div><label>Betrag ฿</label><input class="n" id="l-amt" placeholder="345.596,79"></div></div>'
   + '<div class="frow one"><div><label>Notiz</label><input id="l-note" placeholder="optional"></div></div>'
   + '<div class="mact"><button class="cancel" onclick="closeM()">Abbrechen</button>'

function saveL(){
  var a=num($('l-amt').value);
  if(a<=0){ say('Betrag fehlt.'); return; }
  IDB.ref('ledger/'+uid()).set({ date:$('l-date').value||todayISO(), type:$('l-type').value,
    amount:a, note:$('l-note').value.trim(), ts:Date.now() })
    .then(function(){ say('Gebucht.'); }).catch(oops);
  closeM();
}
function delL(id){
  if(!confirm('Buchung löschen?')) return;
  IDB.ref('ledger/'+id).remove().then(function(){ say('Gelöscht.'); }).catch(oops);
}

/* ── Einstellungen ───────────────────────────────────────────────────────── */
function saveCfg(){
  IDB.ref('cfg').update({ rate:num($('s-rate').value), months:num($('s-mon').value),
                          soloAlex:num($('s-solo').value) })
    .then(function(){ say('Gespeichert.'); }).catch(oops);
}
function addAcc(){
  var n=prompt('Name:','Alex'); if(!n) return;
  var p=prompt('PIN (4–8 Ziffern):',''); if(!p||!/^\d{4,8}$/.test(p)){ say('PIN muss 4–8 Ziffern haben.'); return; }
  if(Object.keys(ACC).some(function(k){ return String((ACC[k]||{}).pin||'')===p; })){ say('Dieser PIN ist schon vergeben.'); return; }
  var r=confirm('Darf er auch ÄNDERN?\n\nOK = Vollzugriff · Abbrechen = nur lesen') ? 'owner':'view';
  IDB.ref('access/'+uid()).set({ name:n.trim(), pin:p, role:r })
    .then(function(){ say('Zugang angelegt.'); }).catch(oops);
}
function delAcc(k){
  if(!confirm('Zugang löschen?')) return;
  IDB.ref('access/'+k).remove().catch(oops);
}
function expJson(){
  var blob=new Blob([JSON.stringify({containers:CTS, ledger:LED, cfg:CFG},null,2)],{type:'application/json'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='container-investments-'+todayISO()+'.json';
  a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); },1500);
}

/* Einmaliger Import der Zahlen aus dem Google-Sheet, damit die Seite nicht
   leer startet. Faellt aus, sobald irgendetwas drinsteht — zweimal
   importieren gaebe doppelte Container. */
function seed(){
  if(Object.keys(CTS).length || Object.keys(LED).length){
    say('Es stehen schon Daten drin — Import übersprungen.',3200); return;
  }
  if(!confirm('Container 1–4 und Alex’ zwei Einzahlungen aus dem Sheet eintragen?')) return;
  var C=[
    /* Fällig laut Sheet; Ankunft daraus zurückgerechnet (fällig − 2 Monate). */
    {name:'Container 1', price:650265,   order:'2026-05-28', arrive:'2026-05-28', invA:325132.50, invN:325132.50},
    {name:'Container 2', price:623840,   order:'2026-06-06', arrive:'2026-06-06', invA:623840,    invN:0},
    /* Im Sheet steht bei Container 3 als Einsatz 205.124,05 — das ergibt zusammen
       mehr als den Kaufpreis. Die Auszahlungsspalte dort rechnet mit 410.048, also
       mit der halben Summe: 205.024,00. Ich nehme die. */
    {name:'Container 3', price:410048,   order:'2026-06-22', arrive:'2026-08-11', invA:205024, invN:205024},
    {name:'Container 4', price:675859.80,order:'2026-07-20', arrive:'2026-09-03', invA:337929.90, invN:337929.90}
  ];
  var up={};
  C.forEach(function(c,i){
    var d=addM(c.arrive, DEF.months);
    c.rate=''; c.pctA=''; c.due='';
    c.paid = dayNo(d) < dayNo(todayISO());
    if(c.paid) c.paidDate=d;
    c.ts=Date.now()+i;
    up['containers/seed'+(i+1)]=c;
  });
  up['ledger/seed1']={ date:'2026-05-05', type:'in', amount:345596.79, note:'Startkapital Alex', ts:Date.now() };
  up['ledger/seed2']={ date:'2026-05-08', type:'in', amount:610000,    note:'Startkapital Alex', ts:Date.now()+1 };
  IDB.ref().update(up).then(function(){ say('Sheet-Daten übernommen.'); }).catch(oops);
}

  view=v;
  Array.prototype.forEach.call($('tabs').children, function(b){

/* ═══════════════════════════════════════════════════════════════════════════
   10 · PIN
   ---------------------------------------------------------------------------
   Zwei Türen: mein KP-PIN (Buchhaltungsrecht — dieselbe Person, die auch die
   Einkaufspreise sehen darf) und die eigenen PINs unter invest/access, damit
   Alex reinschauen kann, ohne irgendwo sonst im System zu stehen.
   ═══════════════════════════════════════════════════════════════════════════ */
var PIN_MAX=8, pin='';
function dots(){
  var n=Math.max(4, pin.length);
  $('dots').innerHTML=Array.from({length:n},function(_,i){
    return '<div class="dot'+(i<pin.length?' on':'')+'"></div>'; }).join('');
}
function pad(d){
  if(d==='<'){ pin=pin.slice(0,-1); dots(); return; }
  if(d==='✓'){ if(pin.length>=4) tryPin(); return; }
  if(pin.length>=PIN_MAX) return;
  pin+=d; dots();
}
function findPin(p){
  var k=Object.keys(ACC).find(function(k){ return String((ACC[k]||{}).pin||'')===p; });
  if(k) return { name:ACC[k].name||'Zugang', role:ACC[k].role==='owner'?'owner':'view', boss:false, acc:k, id:'acc:'+k };
  var s=staffList.find(function(x){ return x && x.id===OWNER_STAFF && x.active!==false && String(x.pin||'')===p; });
  if(s) return { name:s.name||'André', role:'owner', boss:true, id:'kp:'+s.id };
  return null;
}
function tryPin(){
  var f=findPin(pin);
  if(!f){
    $('pin-err').textContent = (!staffList.length && !Object.keys(ACC).length)
      ? 'Noch am Laden …' : 'PIN stimmt nicht.';
    pin=''; dots();
    var c=$('pad'); if(c){ c.classList.remove('shake'); void c.offsetWidth; c.classList.add('shake'); }
    return;
  }
  me=f; role=f.role; boss=!!f.boss; $('pin-err').textContent='';
  try{ localStorage.setItem('kp-invest-session', JSON.stringify({id:f.id, ts:Date.now()})); }catch(e){}
  logVisit('pin');
  open_();
}
/* Wer schaut wann rein. Nur die Zugaenge von hier (Alex), nicht ich mit dem
   KP-PIN. 'pin' = PIN eingetippt, 'auto' = innerhalb der 4-Stunden-Sitzung
   wieder geoeffnet. Sehen kann das nur der Einstellungen-Reiter. */
function logVisit(kind){
  if(!me || !me.acc) return;
  try{ IDB.ref('visits/'+me.acc+'/'+uid()).set({ ts:Date.now(), k:kind }).catch(function(){}); }catch(e){}
}
function dtTime(ts){
  if(!ts) return '—';
  var d=new Date(ts);
  return p2(d.getDate())+'.'+p2(d.getMonth()+1)+'. '+p2(d.getHours())+':'+p2(d.getMinutes());
}
function open_(){
  $('gate').style.display='none';
  $('app').style.display='';
  $('who').innerHTML='<b>'+esc(me?me.name:'')+'</b> · '+(role==='owner'?'Vollzugriff':'nur lesen');
  /* Den PIN darf nur aendern, wer mit einem Zugang von hier drin ist. Wer mit
     dem KP-PIN kommt, wuerde sonst seinen Login fuer die ganze KP-App aendern —
     das gehoert in die App, nicht hierher. */
  $('pinbtn').style.display = (me && me.acc) ? '' : 'none';
  /* Die Einstellungen gehoeren mir allein — dort haengen die Zugaenge selbst
     dran. Auch ein zweiter Vollzugriff sieht den Reiter nicht. */
  if(!boss){
    var t=$('tabs').querySelector('[data-v="set"]'); if(t) t.style.display='none';
    if(view==='set'){ view='over'; }
  }else if(!open_.vis){
    open_.vis=true;
    IDB.ref('visits').on('value', function(s){ VIS=s.val()||{}; render(); });
  }
  render();
}
/* ── Eigenen PIN aendern ─────────────────────────────────────────────────── */
function openPin(){
  if(!me || !me.acc) return;
  showM('<h3>PIN ändern</h3>'
   + '<div class="hint">Gilt sofort für diesen Zugang. Merk ihn dir gut — zurücksetzen kann ihn nur André.</div>'
   + '<div class="frow one"><div><label>Aktueller PIN</label>'
   +   '<input class="n" id="p-old" type="password" inputmode="numeric" autocomplete="off"></div></div>'
   + '<div class="frow"><div><label>Neuer PIN</label>'
   +   '<input class="n" id="p-new" type="password" inputmode="numeric" autocomplete="off" placeholder="4–8 Ziffern"></div>'
   +   '<div><label>Wiederholen</label>'
   +   '<input class="n" id="p-new2" type="password" inputmode="numeric" autocomplete="off"></div></div>'
   + '<div class="mact"><button class="cancel" onclick="closeM()">Abbrechen</button>'
   +   '<button class="save" onclick="savePin()">Ändern</button></div>');
  setTimeout(function(){ var e=$('p-old'); if(e) e.focus(); }, 60);
}
function savePin(){
  if(!me || !me.acc) return;
  var a=ACC[me.acc]||{};
  var o=$('p-old').value.trim(), n=$('p-new').value.trim(), n2=$('p-new2').value.trim();
  if(String(a.pin||'')!==o){ say('Aktueller PIN stimmt nicht.'); return; }
  if(!/^\d{4,8}$/.test(n)){ say('Neuer PIN: 4 bis 8 Ziffern.'); return; }
  if(n!==n2){ say('Die beiden neuen PINs sind nicht gleich.'); return; }
  // Zwei Zugaenge mit demselben PIN waeren eine Tuer, die zwei Schloesser oeffnet —
  // wer zuerst in der Liste steht, gewinnt. Also vorher abfangen.
  var clash=Object.keys(ACC).some(function(k){ return k!==me.acc && String((ACC[k]||{}).pin||'')===n; });
  if(clash){ say('Dieser PIN ist schon vergeben.'); return; }
  IDB.ref('access/'+me.acc+'/pin').set(n).then(function(){ say('PIN geändert.'); }).catch(oops);
  closeM();
}
$('pinbtn').addEventListener('click', openPin);

$('bye').addEventListener('click', function(){
  try{ localStorage.removeItem('kp-invest-session'); }catch(e){}
  location.reload();
});
$('pad').innerHTML=['1','2','3','4','5','6','7','8','9','<','0','✓']
  .map(function(k){
    var cls = k==='<' ? ' class="del"' : k==='✓' ? ' class="ok"' : '';
    return '<button type="button" data-k="'+k+'"'+cls+'>'+(k==='<'?'⌫':k)+'</button>';
  }).join('');
$('pad').addEventListener('click', function(e){
  var k=e.target && e.target.getAttribute && e.target.getAttribute('data-k');
  if(k) pad(k);
});
document.addEventListener('keydown', function(e){
  if($('gate').style.display!=='none'){
    if(/^[0-9]$/.test(e.key)) pad(e.key);
    else if(e.key==='Backspace'){ pad('<'); e.preventDefault(); }
    else if(e.key==='Enter') pad('✓');
  }else if(e.key==='Escape'){ closeM(); }
});
dots();

/* ═══════════════════════════════════════════════════════════════════════════
   11 · LIVE
   ═══════════════════════════════════════════════════════════════════════════ */
function resume(){
  if(me) return;
  try{
    var s=JSON.parse(localStorage.getItem('kp-invest-session')||'null');
    if(!s || (Date.now()-s.ts)>=4*3600*1000) return;       // 4 Stunden, wie im POS
    if(s.id.indexOf('acc:')===0){
      var a=ACC[s.id.slice(4)];
      if(a){ me={name:a.name||'Zugang', acc:s.id.slice(4)}; role=a.role==='owner'?'owner':'view'; boss=false; logVisit('auto'); open_(); }
    }else{
      var st=staffList.find(function(x){ return x && x.id===OWNER_STAFF && x.id===s.id.slice(3) && x.active!==false; });
      if(st){ me={name:st.name||'André'}; role='owner'; boss=true; open_(); }
    }
  }catch(e){}
}
function sub(){
  IDB.ref('containers').on('value', function(s){ CTS=s.val()||{}; render(); });
  IDB.ref('ledger').on('value',     function(s){ LED=s.val()||{}; render(); });
  IDB.ref('cfg').on('value',        function(s){ CFG=s.val()||{}; render(); });
  IDB.ref('access').on('value',     function(s){ ACC=s.val()||{}; resume(); if(me) render(); });
  IDB.raw('staffList').on('value',  function(s){
    var v=s.val()||[];
    staffList = Array.isArray(v) ? v : Object.keys(v).map(function(k){ return v[k]; });
    staffList = staffList.filter(Boolean);
    resume();
  });
}
iAuthReady.then(function(){ sub(); }).catch(function(){
  $('pin-err').textContent='Keine Verbindung zur Datenbank.';
});
</script>
