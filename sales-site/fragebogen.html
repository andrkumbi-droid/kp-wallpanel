<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14100A">
<meta name="robots" content="noindex">
<title>KP Wallpanel · แบบสอบถามทีม</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<!-- ═══ Team-Fragebogen zum Partnerprogramm (11.10.2026) ════════════════════
     Ein Link für 2–3 Leute aus dem Team. Antworten landen in forms/<FORM>/<push>
     (nur schreiben, nicht lesen — die Regeln lassen Fremde nichts sehen).
     Eigene Firebase-App-Instanz "form": meldet sich anonym an, ohne eine
     KP-Gerätesitzung auf demselben Browser anzufassen. -->
<style>
:root{ --gold:#D4AF37; --ink:#14100A; --cream:#F5EFE0; --bg:#F6F4EF; --card:#fff; --text:#221C11; --text2:#6B6355; --border:#E5E0D4; --border2:#D5CEBF; }
*{ box-sizing:border-box; }
body{ margin:0; font-family:'Prompt','Leelawadee UI',system-ui,sans-serif; background:var(--bg); color:var(--text); font-size:16px; line-height:1.55; }
header{ background:radial-gradient(120% 90% at 50% 0%, #2c2316 0%, var(--ink) 65%); color:var(--cream); padding:28px 18px 26px; text-align:center; }
header .mk{ width:58px; height:58px; margin:0 auto 10px; border-radius:18px; background:linear-gradient(145deg,#f3d77a,#b88a22); color:#1a140a; font-weight:900; font-size:22px; display:flex; align-items:center; justify-content:center; }
header h1{ margin:0; font-size:21px; font-weight:800; }
header p{ margin:6px auto 0; max-width:520px; font-size:14px; color:#BFB49E; }
main{ max-width:640px; margin:0 auto; padding:16px 14px 60px; }
.q{ background:var(--card); border:1px solid var(--border); border-radius:18px; padding:16px; margin-bottom:12px; box-shadow:0 2px 10px rgba(30,24,10,.05); }
.q .n{ display:inline-block; min-width:26px; height:26px; border-radius:8px; background:var(--ink); color:var(--gold); font-weight:800; font-size:13px; text-align:center; line-height:26px; margin-right:6px; }
.q .t{ font-weight:700; font-size:16px; }
.q .h{ font-size:13.5px; color:var(--text2); margin:4px 0 10px; }
input[type=text],textarea{ width:100%; font:inherit; font-size:16px; padding:12px 14px; border:1.5px solid var(--border2); border-radius:12px; background:#fff; outline:none; }
textarea{ min-height:84px; resize:vertical; }
input:focus,textarea:focus{ border-color:#A8842C; box-shadow:0 0 0 3px rgba(212,175,55,.2); }
.opts{ display:flex; flex-direction:column; gap:8px; margin-bottom:8px; }
.opts label{ display:flex; gap:10px; align-items:flex-start; padding:11px 12px; border:1.5px solid var(--border2); border-radius:12px; cursor:pointer; }
.opts input{ margin-top:4px; accent-color:#A8842C; width:18px; height:18px; flex-shrink:0; }
.opts label:has(input:checked){ border-color:#A8842C; background:#FBF6E7; }
button{ font:inherit; }
.send{ width:100%; border:none; border-radius:15px; padding:16px; font-size:17px; font-weight:800; color:#1a140a; background:linear-gradient(145deg,#f0d26e,#b88a22); box-shadow:0 8px 22px rgba(212,175,55,.3); cursor:pointer; }
.send[disabled]{ opacity:.6; }
.msg{ text-align:center; margin-top:10px; min-height:20px; font-size:14px; color:#b91c1c; }
.done{ text-align:center; padding:60px 20px; }
.done .ic{ font-size:54px; }
.req{ color:#b91c1c; }
</style>
</head>
<body>
<header>
  <div class="mk">KP</div>
  <h1>แบบสอบถามทีม · โปรแกรมตัวแทนขาย</h1>
  <p>ช่วยตอบคำถามสั้น ๆ เหล่านี้ เพื่อให้ข้อมูลในแอปตัวแทนขายถูกต้อง ส่วนใหญ่แค่ติ๊กเลือก เลือกได้หลายข้อในคำถามที่เขียนว่า "เลือกได้หลายข้อ" ใช้เวลาประมาณ 10 นาที ถ้าไม่แน่ใจข้อไหน เขียนว่า "ไม่แน่ใจ" ได้เลย</p>
</header>
<main id="form">
  <div class="q"><div class="t">ชื่อของคุณ <span class="req">*</span></div><div class="h"></div><div class="opts"><label><input type="radio" name="who" value="Pim"><span>Pim</span></label><label><input type="radio" name="who" value="Bobby"><span>Bobby</span></label></div><input type="text" id="name" maxlength="60" placeholder="หรือพิมพ์ชื่อ"></div>
  <div id="qs"></div>
  <button class="send" id="send" onclick="sendIt()">ส่งคำตอบ</button>
  <div class="msg" id="msg"></div>
</main>
<script>
var FORM='team-2026-10';
// [id, question, hint, options (radio, last one may carry a text field) or null = free text]
// [id, type r=one answer / c=several, question, hint, options] — every question also has a free-text box
var Q=[
  ['A','ข้อมูลสำหรับตัวแทน (แสดงในแอป)'],
  ['hours','r','เวลาทำการของออฟฟิศ (ที่ตัวแทนติดต่อได้)','', ['จ.–ส. 08:00–17:00','จ.–ส. 09:00–18:00','ทุกวัน 08:00–17:00','อื่น ๆ (เขียนด้านล่าง)']],
  ['confirm','r','ออฟฟิศยืนยันออเดอร์ของตัวแทนได้ภายใน','ในเวลาทำการ', ['ภายใน 1 ชม.','ภายใน 2 ชม.','ภายในวันเดียวกัน','วันทำการถัดไป']],
  ['daysBkk','r','ส่งถึงลูกค้า กทม.-ปริมณฑล หลังยืนยันออเดอร์','', ['1 วัน','1–2 วัน','2–3 วัน','3–5 วัน']],
  ['daysProv','r','ส่งถึงลูกค้าต่างจังหวัด','ถ้าแต่ละภาคไม่เท่ากัน เขียนด้านล่าง', ['2–3 วัน','3–5 วัน','5–7 วัน','ขึ้นกับภาค (เขียนด้านล่าง)']],
  ['island','t','ค่าส่งเพิ่มไปเกาะ','เกาะละบรรทัด: ชื่อเกาะ – ค่าส่งเพิ่ม (บาท) เช่น สมุย พะงัน เต่า ช้าง กูด ล้าน ลันตา', null],
  ['B','การจัดส่งและการชำระเงิน'],
  ['shipper','c','ส่งต่างจังหวัดผ่านบริษัทขนส่ง (ไม่ใช่รถ KP) ลูกค้าจ่ายยังไง','เลือกได้หลายข้อ', ['เก็บเงินปลายทางได้ เหมือนรถ KP','ต้องโอนเต็มก่อนส่ง','มัดจำ 30% ก่อนส่ง','มัดจำ 50% ก่อนส่ง','ยอด 20,000 บาทขึ้นไป ต้องมัดจำ','ขึ้นกับลูกค้า ออฟฟิศตัดสินใจ']],
  ['call','r','คนขับโทรหาลูกค้าก่อนเข้าส่ง','ข้อความติดตามสถานะในแอปจะบอกลูกค้าตามนี้', ['โทรทุกครั้ง','โทรบางครั้ง','ไม่โทร']],
  ['sheet','c','ใบส่งของ (delivery sheet) ของออเดอร์ตัวแทน ควรเป็นยังไง','เลือกได้หลายข้อ', ['เขียนว่า "สั่งผ่าน [ชื่อแบรนด์ตัวแทน]"','ใส่เบอร์โทรตัวแทน','ใส่เบอร์ KP ด้วย','คนขับไม่แจกการ์ด/QR LINE ของ KP ให้ลูกค้าของตัวแทน','ใบเสร็จ/ใบกำกับภาษีออกในชื่อ KP เหมือนเดิม']],
  ['refuse','c','ถ้าลูกค้าของตัวแทนไม่รับของตอนส่ง','เลือกได้หลายข้อ', ['ตัวแทนไม่ได้ค่าคอมออเดอร์นั้น','ตัวแทนช่วยออกค่าส่งกลับ','ครั้งแรกเตือนอย่างเดียว','ครบ 2 ครั้ง ลูกค้ารายต่อไปต้องมัดจำ']],
  ['C','ตัวแทนกับลูกค้า'],
  ['visit','c','ลูกค้าของตัวแทนขอมาดูของที่ร้าน/โกดัง','เลือกได้หลายข้อ', ['ได้ ต้องนัดล่วงหน้า 1 วัน','ได้ ตัวแทนต้องมาด้วย','ดูได้เฉพาะโชว์รูม/หน้าร้าน','ห้ามเข้าโกดัง','ตัวแทนแจ้งในแอป/กลุ่มก่อนทุกครั้ง','ไม่ได้']],
  ['discount','c','ส่วนลดที่ตัวแทนให้ลูกค้าได้','เลือกได้หลายข้อ', ['ห้ามให้ส่วนลด ใช้ราคาเดียวกับ KP','ให้ได้ไม่เกินค่าคอมของตัวเอง (หักจากค่าคอม)','ส่งฟรีแทนส่วนลดได้ (หักจากค่าคอม)','ห้ามโพสต์ราคาลดในเพจ','งาน 100 แผ่นขึ้นไป ขอราคาพิเศษจากออฟฟิศ']],
  ['claim','c','ลูกค้าแจ้งของเสียหาย','เลือกได้หลายข้อ', ['ต้องมีรูปตอนรับของ','แจ้งภายใน 7 วันหลังรับของ','ตัวแทนเป็นคนส่งเรื่องให้ออฟฟิศ','ออฟฟิศตัดสินใจ: ลดราคา หรือ ส่งของใหม่','ปุ่ม "แจ้งเคลม" ในแอปตัวแทน']],
  ['promise','c','ถ้าตัวแทนพูดเกินจริง (เช่น ใช้กลางแจ้งได้ รับประกัน X ปี) แล้วลูกค้าร้องเรียน','เลือกได้หลายข้อ', ['คืนค่าคอมออเดอร์นั้น','เตือนเป็นลายลักษณ์อักษร','ระงับบัญชีหลังเตือน 2 ครั้ง','ช่วยรับผิดชอบค่าเสียหาย']],
  ['forbid','c','ตัวแทนห้ามทำอะไร','เลือกได้หลายข้อ', ['ใช้คำว่า "KP" ในชื่อเพจหรือโลโก้','ขายบน Shopee / Lazada / TikTok Shop','ถ่ายฉลาก/กล่องของซัพพลายเออร์','คอมเมนต์หรือแย่งลูกค้าในเพจ KP','รับเงินลูกค้าเข้าบัญชีส่วนตัว','ลงโฆษณาด้วยคำว่า KP Wallpanel']],
  ['D','การดูแลตัวแทน'],
  ['contact','c','ใครเป็นผู้ติดต่อหลักของตัวแทน','เลือกได้หลายคน ใส่ LINE ด้านล่าง', ['Pim','Bobby','Noy','Milk']],
  ['channel','c','ตัวแทนติดต่อ KP ทางไหน','เลือกได้หลายข้อ', ['กลุ่ม LINE "KP Partner"','แชทในแอปตัวแทน','โทรศัพท์','LINE ส่วนตัวของผู้ดูแล']],
  ['reply','r','ตอบคำถามตัวแทนภายใน','ในเวลาทำการ', ['15 นาที','30 นาที','1 ชม.','ภายในวัน']],
  ['sample','c','ตัวอย่างสินค้า (ชิ้นตัวอย่างสี) ให้ตัวแทน','เลือกได้หลายข้อ', ['ส่งฟรี','คิดค่าส่ง 50 บาท','คิดค่าส่ง 100 บาท','มัดจำ คืนเงินเมื่อขายครบ … แผ่น','มารับเองที่ร้าน ฟรี']],
  ['film','c','ตัวแทนมาถ่ายรูป/คลิปที่ร้าน','เลือกได้หลายข้อ', ['นัดกันในกลุ่มแชท','อังคาร/พฤหัส 10–12 น.','ทุกวันก่อน 11 โมง','ห้ามตอนรถกำลังขึ้นของ','ทำผนังตัวอย่าง 4–6 แบบไว้ถ่ายคลิป']],
  ['start','c','สัปดาห์แรก ตัวแทนต้องได้อะไรจาก KP','เลือกได้หลายข้อ', ['อบรม 2–3 ชม. (สินค้า เครื่องคิดเลข กติกา)','ลองสั่งออเดอร์ทดสอบ 1 ครั้ง','สัญญาตัวแทน 2 หน้า','รูป/คลิปใน Google Drive','กลุ่ม LINE','ชิ้นตัวอย่างสี']],
  ['inactive','r','ตัวแทนที่ไม่มีออเดอร์เลย','', ['60 วัน → พักบัญชี','90 วัน → พักบัญชี','ไม่ต้องพัก']],
  ['report','c','ออฟฟิศอยากเห็นอะไรในรายงานตัวแทน','เลือกได้หลายข้อ', ['จำนวนออเดอร์','ยอดขาย','จำนวนแผ่น','ลูกค้าที่ยังไม่จ่าย','ออเดอร์ที่ถูกยกเลิก/ไม่รับของ','การร้องเรียน','ค่าคอมที่ต้องจ่าย']],
  ['E','ภาษีและอื่น ๆ'],
  ['tax','r','ค่าคอมตัวแทน: หักภาษี ณ ที่จ่าย 3% และออก 50 ทวิ ไหม','ถ้าไม่แน่ใจ ช่วยถามสำนักงานบัญชี', ['หัก 3% และออก 50 ทวิ','ไม่หักภาษี','ยังไม่ทราบ ต้องถามสำนักงานบัญชี']],
  ['other','t','มีอะไรอยากบอกเพิ่มเติม','ปัญหาที่อาจเกิด คำถามที่ลูกค้าถามบ่อย ไอเดีย ฯลฯ', null]
];
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
var _n=0;
document.getElementById('qs').innerHTML=Q.map(function(q){
  if(q.length===2) return '<h2 style="font-size:15px;margin:22px 4px 10px;color:#6B6355;letter-spacing:.02em">'+esc(q[1])+'</h2>';
  _n++;
  var h='<div class="q"><div class="t"><span class="n">'+_n+'</span>'+esc(q[2])+'</div>'+(q[3]?'<div class="h">'+esc(q[3])+'</div>':'<div class="h"></div>');
  if(q[4]) h+='<div class="opts">'+q[4].map(function(o){ return '<label><input type="'+(q[1]==='c'?'checkbox':'radio')+'" name="r-'+q[0]+'" value="'+esc(o)+'"><span>'+esc(o)+'</span></label>'; }).join('')+'</div>'
    +'<textarea id="t-'+q[0]+'" maxlength="1200" placeholder="'+(q[1]==='t'?'':'อื่น ๆ / รายละเอียด (ถ้ามี)')+'"></textarea>';
  else h+='<textarea id="t-'+q[0]+'" maxlength="1200"></textarea>';
  return h+'</div>';
}).join('');
firebase.initializeApp({
  apiKey: "AIzaSyBhUzwMR28dvulez9q6AZ4gZS80Y9VK0qQ",
  authDomain: "kp-wallpanel.firebaseapp.com",
  databaseURL: "https://kp-wallpanel-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "kp-wallpanel",
  appId: "1:794246593779:web:703fc0a4ba89ba58734b86"
}, 'form');
var APP=firebase.app('form');
function sendIt(){
  var who=document.querySelector('input[name="who"]:checked'), name=(document.getElementById('name').value.trim()||(who?who.value:'')).slice(0,60), msg=document.getElementById('msg'), btn=document.getElementById('send');
  if(!name){ msg.textContent='กรุณาใส่ชื่อของคุณ'; document.getElementById('name').focus(); return; }
  var a={}, any=false;
  Q.forEach(function(q){
    if(q.length===2) return;
    var picked=Array.prototype.map.call(document.querySelectorAll('input[name="r-'+q[0]+'"]:checked'), function(x){ return x.value; }).join(' · ');
    var t=((document.getElementById('t-'+q[0])||{}).value||'').trim();
    var v=(picked+(picked&&t?' — ':'')+t).slice(0,1600);
    if(v){ a[q[0]]=v; any=true; }
  });
  if(!any){ msg.textContent='ยังไม่มีคำตอบ'; return; }
  btn.disabled=true; msg.style.color='#6B6355'; msg.textContent='⏳ กำลังส่ง…';
  var auth=APP.auth();
  (auth.currentUser ? Promise.resolve() : auth.signInAnonymously()).then(function(){
    return APP.database().ref('forms/'+FORM).push({name:name, a:a, ts:firebase.database.ServerValue.TIMESTAMP});
  }).then(function(){
    document.getElementById('form').innerHTML='<div class="done"><div class="ic">🙏</div><h2>ขอบคุณค่ะ / ครับ</h2><p>ได้รับคำตอบของคุณแล้ว</p></div>';
    window.scrollTo(0,0);
  }).catch(function(e){ btn.disabled=false; msg.style.color='#b91c1c'; msg.textContent='ส่งไม่สำเร็จ ลองใหม่อีกครั้ง ('+((e&&e.code)||'error')+')'; });
}
</script>
</body>
</html>
