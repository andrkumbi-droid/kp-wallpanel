<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- 8-Bit-Münze auf Automatenblau. Auf ein 16er-Raster gezeichnet, nicht
       gesetzt: eine Pixelschrift wäre bei 16px Kantenlänge Matsch, ein
       Umriss aus Rechtecken bleibt scharf. Passt zur Seite und ist in der
       Tab-Leiste sofort von den fünf KP-Buchstaben-Icons zu unterscheiden. -->
  <rect width="16" height="16" fill="#0E0E1C"/>
  <rect x="0" y="0" width="16" height="1" fill="#3C3C6E"/>
  <rect x="0" y="15" width="16" height="1" fill="#3C3C6E"/>
  <rect x="0" y="0" width="1" height="16" fill="#3C3C6E"/>
  <rect x="15" y="0" width="1" height="16" fill="#3C3C6E"/>

  <!-- Umriss -->
  <rect x="6" y="2" width="4" height="1" fill="#8A5A12"/>
  <rect x="4" y="3" width="8" height="1" fill="#8A5A12"/>
  <rect x="3" y="4" width="10" height="8" fill="#8A5A12"/>
  <rect x="4" y="12" width="8" height="1" fill="#8A5A12"/>
  <rect x="6" y="13" width="4" height="1" fill="#8A5A12"/>

  <!-- Fläche -->
  <rect x="6" y="3" width="4" height="1" fill="#FCD800"/>
  <rect x="4" y="4" width="8" height="1" fill="#FCD800"/>
  <rect x="4" y="5" width="8" height="6" fill="#FCD800"/>
  <rect x="5" y="11" width="6" height="1" fill="#FCD800"/>

  <!-- Prägung -->
  <rect x="7" y="5" width="2" height="6" fill="#B07A10"/>

  <!-- Glanz -->
  <rect x="5" y="4" width="2" height="1" fill="#FFF6B0"/>
  <rect x="5" y="5" width="1" height="3" fill="#FFF6B0"/>
</svg>
