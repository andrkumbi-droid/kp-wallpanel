<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- 8-Bit-Münze auf Automatenblau, mit KP eingeprägt. Auf ein 16er-Raster
       gezeichnet, nicht gesetzt: eine Pixelschrift wäre bei 16px Kantenlänge
       Matsch, Buchstaben aus einzelnen Rechtecken bleiben scharf.
       Die Münze ist gegenüber der ersten Fassung um je eine Spalte breiter.
       Das ist der ganze Trick: Prägung und Münzrand haben dieselbe Farbe,
       ohne den Goldrand dazwischen wäre das K mit dem Rand verschmolzen.
       Raster: Fläche x3–12, K auf x4–6, P auf x9–11, beide y5–9.          -->
  <rect width="16" height="16" fill="#0E0E1C"/>
  <rect x="0" y="0" width="16" height="1" fill="#3C3C6E"/>
  <rect x="0" y="15" width="16" height="1" fill="#3C3C6E"/>
  <rect x="0" y="0" width="1" height="16" fill="#3C3C6E"/>
  <rect x="15" y="0" width="1" height="16" fill="#3C3C6E"/>

  <!-- Umriss -->
  <rect x="6" y="2" width="4" height="1" fill="#8A5A12"/>
  <rect x="4" y="3" width="8" height="1" fill="#8A5A12"/>
  <rect x="2" y="4" width="12" height="8" fill="#8A5A12"/>
  <rect x="4" y="12" width="8" height="1" fill="#8A5A12"/>
  <rect x="6" y="13" width="4" height="1" fill="#8A5A12"/>

  <!-- Fläche -->
  <rect x="6" y="3" width="4" height="1" fill="#FCD800"/>
  <rect x="4" y="4" width="8" height="1" fill="#FCD800"/>
  <rect x="3" y="5" width="10" height="6" fill="#FCD800"/>
  <rect x="4" y="11" width="8" height="1" fill="#FCD800"/>
  <rect x="6" y="12" width="4" height="1" fill="#FCD800"/>

  <!-- Glanz, oben links über der Prägung -->
  <rect x="4" y="4" width="3" height="1" fill="#FFF6B0"/>

  <!-- Prägung K -->
  <rect x="4" y="5" width="1" height="5" fill="#8A5A12"/>
  <rect x="6" y="5" width="1" height="1" fill="#8A5A12"/>
  <rect x="5" y="6" width="1" height="1" fill="#8A5A12"/>
  <rect x="5" y="8" width="1" height="1" fill="#8A5A12"/>
  <rect x="6" y="9" width="1" height="1" fill="#8A5A12"/>

  <!-- Prägung P -->
  <rect x="9" y="5" width="1" height="5" fill="#8A5A12"/>
  <rect x="10" y="5" width="1" height="1" fill="#8A5A12"/>
  <rect x="11" y="6" width="1" height="1" fill="#8A5A12"/>
  <rect x="10" y="7" width="1" height="1" fill="#8A5A12"/>
</svg>
