<!-- ═══════════════ FIREBASE — dasselbe Projekt wie index.html / pos.html ══════════
     Dieselben Knoten unter v2/: orders · activeTours · drivers · staffList ·
     tourReg · tourNo · tourPayouts. Die Seite ist eine zweite Tür in dieselben
     Daten, keine Kopie davon.                                                   -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-check-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script>
// ── DEMO ODER ECHT ────────────────────────────────────────────────────────
// Standard ist DEMO: kein initializeApp, kein Login bei Firebase, kein einziges
// Byte zur echten Datenbank. Die Seite läuft auf einem erfundenen Datensatz
// (siehe demoSeed unten) und kann gefahrlos zerpflückt werden. Erst
// ?source=live (gemerkt je Gerät, ?source=demo dreht zurück) hängt sie an die
// echten Knoten — und selbst dann schreibt sie nichts, bis "เปิดใช้จริง" gedrückt ist.
var DEMO=true;
try{
  var _srcQ=(location.search.match(/[?&]source=(live|demo)/)||[])[1];
  if(_srcQ) localStorage.setItem('kp-tour-source', _srcQ);
  DEMO = localStorage.getItem('kp-tour-source')!=='live';
}catch(e){}
var DB, W, LIVE=false, tdAuthReady;
if(!DEMO){
firebase.initializeApp({
  apiKey: "AIzaSyBhUzwMR28dvulez9q6AZ4gZS80Y9VK0qQ",
  authDomain: "kp-wallpanel.firebaseapp.com",
  databaseURL: "https://kp-wallpanel-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "kp-wallpanel",
  storageBucket: "kp-wallpanel.firebasestorage.app",
  messagingSenderId: "794246593779",
  appId: "1:794246593779:web:703fc0a4ba89ba58734b86"
});
// ── APP CHECK — Regeln wortgleich zu pos.html (dort ausführlich begründet):
//    · erst aktivieren, wenn <body> existiert
//    · reCAPTCHA vorher anpingen — nicht erreichbar ⇒ überspringen
//    · localhost nur mit REGISTRIERTEM Debug-Token (?acdebug=…), sonst hängt die
//      RTDB-Verbindung ewig
//    · Geräte-Notaus localStorage 'kpAcOff' (GETEILT mit index.html/pos.html)
var APPCHECK_SITE_KEY = '6LebwYgtAAAAAB9LWZ91x3eZfllT9mPsV3Y8Vfpv';
function acReachable(){
  return new Promise(function(res){
    var to=setTimeout(function(){ res(false); }, 5000);
    fetch('https://www.google.com/recaptcha/api.js',{mode:'no-cors'})
      .then(function(){ clearTimeout(to); res(true); })
      .catch(function(){ clearTimeout(to); res(false); });
  });
}
var tdAppCheckReady = new Promise(function(resolve){
  var _acOff=false; try{ _acOff=localStorage.getItem('kpAcOff')==='1'; }catch(e){}
  if(_acOff){ console.warn('[TOUR] App Check auf diesem Gerät aus (kpAcOff)'); resolve(false); return; }
  if(!APPCHECK_SITE_KEY || !firebase.appCheck){ resolve(false); return; }
  function go(){
    try{
      if(/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname) || location.protocol==='file:'){
        var _acQ=(location.search.match(/[?&]acdebug=([^&]+)/)||[])[1];
        if(_acQ){ try{ localStorage.setItem('kpAcDebugToken', decodeURIComponent(_acQ)); }catch(e){} }
        var _acSaved=''; try{ _acSaved=localStorage.getItem('kpAcDebugToken')||''; }catch(e){}
        if(!_acSaved){ console.warn('[TOUR] localhost ohne registrierten Debug-Token — App Check übersprungen'); resolve(false); return; }
        self.FIREBASE_APPCHECK_DEBUG_TOKEN=_acSaved;
      }
      firebase.appCheck().activate(APPCHECK_SITE_KEY, true);
      window._tdAcOn=true; resolve(true);
    }catch(e){ console.error('[TOUR] App Check activate failed:', e&&e.message); resolve(false); }
  }
  function whenBody(fn){ if(document.body) fn(); else setTimeout(function w(){ document.body?fn():setTimeout(w,5); },0); }
  acReachable().then(function(ok){
    if(!ok){ console.warn('[TOUR] reCAPTCHA nicht erreichbar — App Check übersprungen'); resolve(false); return; }
    whenBody(go);
  });
});
// SEASON ROOT — muss zu index.html passen (v2/).
var SEASON='v2';
var _rootDb = firebase.database();
var DB = { ref:function(p){ return _rootDb.ref(SEASON+'/'+(p==null?'':p)); } };
// ── VORSCHAU ODER SCHARF ──────────────────────────────────────────────────
// Diese Seite hängt an derselben Datenbank wie das Büro. Solange sie gebaut und
// ausprobiert wird, darf ein Klick hier keine echte Tour anfassen: Lesen läuft
// immer live (DB.ref), Schreiben läuft über W.ref — und das ist stumm, bis die
// Seite je Gerät bewusst scharf geschaltet wird (localStorage kp-tour-live).
var LIVE=false; try{ LIVE=localStorage.getItem('kp-tour-live')==='1'; }catch(e){}
var _mute=(function(){
  var ok=function(){ return Promise.resolve(); };
  var m={ set:ok, update:ok, remove:ok, push:function(){ return m; },
          transaction:function(fn, done){ if(done) try{ done(null,false,null); }catch(e){} return ok(); },
          then:function(f){ return ok().then(f); }, catch:ok };
  return m;
})();
var W = { ref:function(p){ return LIVE ? DB.ref(p) : _mute; } };
function _tdAcRetry(){
  try{
    if(window._tdAcOn && !sessionStorage.getItem('kpAcRetry')){
      sessionStorage.setItem('kpAcRetry','1');
      localStorage.setItem('kpAcOff','1');
      setTimeout(function(){ location.reload(); }, 400);
      return true;
    }
  }catch(e){}
  return false;
}
function _tdSignIn(attempt){
  return firebase.auth().signInAnonymously()
    .then(function(){ window._tdAuthOk=true; return true; })
    .catch(function(e){
      console.error('[TOUR] anonymous sign-in failed (try '+attempt+'):', e&&e.code, e&&e.message);
      window._tdAuthOk=false;
      if(_tdAcRetry()) return false;
      var wait=Math.min(30000, 2000*Math.pow(2, Math.min(attempt-1,4)));
      return new Promise(function(res){ setTimeout(function(){ res(_tdSignIn(attempt+1)); }, wait); });
    });
}
var tdAuthReady = tdAppCheckReady.then(function(){ return _tdSignIn(1); });
} else {
  // DEMO: Attrappen mit denselben Methoden, damit kein Aufruf ins Leere greift.
  // Lesen liefert nichts (die Daten kommen aus demoSeed), Schreiben verpufft.
  var _off=function(){ return _off_; }, _off_={ on:_off, once:_off, off:_off, set:_off, update:_off, remove:_off, push:_off,
    transaction:function(fn,done){ if(done) try{ done(null,false,null); }catch(e){} return _off_; },
    limitToLast:_off, then:function(f){ return Promise.resolve().then(f); }, catch:function(){ return _off_; } };
  DB={ ref:_off }; W={ ref:_off }; tdAuthReady=Promise.resolve(false);
}
</script>

<style>
/* ═══════════════════════ ร้าน — WARM & RUND ═══════════════════════
   Stil D aus dem Vergleich (15.09.): Creme als Grund, weisse runde Karten mit
   weichem warmem Schatten, Ton (Clay) als einziger Akzent für Beträge und den
   Hauptknopf, Salbeigrün für alles Erledigte. Grosse Flächen für den Daumen,
   nichts ist kleiner als 40 px. Mitr (rund) für Titel, Zahlen und Knöpfe,
   Sarabun für Fliesstext. Keine Umschaltung mehr — das ist das Gesicht.

   Die Token-NAMEN sind die alten geblieben (ice = Akzent, jade = erledigt,
   amber = wartet, coral = Problem, violet = Tour-ID), damit das JS unangetastet
   bleibt; nur die Werte sind neu.                                        */
:root{
  color-scheme:light;
  --ink:#FFF8EE; --ink2:#FFFFFF; --ink3:#FBF3E6; --ink4:#F3E9D8;
  --line:#EADFCB; --line2:#DCCDB3;
  --plat:#2B241C; --plat2:#6E6252; --plat3:#9A8E7C;
  --s0:rgba(43,36,28,.012); --s1:rgba(43,36,28,.03); --s2:#FFF8EE; --s3:#F6ECDC; --s4:rgba(43,36,28,.16); --track:#EADFCB;
  --ice:#C4653A; --ice2:#A34F29; --ice-deep:#A34F29; --on-ice:#FFFFFF;
  --ice-dim:#F6E7DC; --ice-soft:#FBF0E7; --ice-line:#E7C4AF; --ice-glow:rgba(196,101,58,.28);
  --jade:#3F7D5C; --jade-dim:#E1F0E7; --jade-line:#B9DBC7;
  --amber:#B8801E; --amber-dim:#FBF0D9; --amber-line:#EAD3A2;
  --coral:#C9463D; --coral-dim:#FBE6E3; --coral-line:#F0BDB8;
  --violet:#7A5AA8; --violet-dim:#EEE7F7; --violet-line:#D6C8EA;
  --glow2:transparent;
  --barbg:rgba(255,248,238,.88); --veil:rgba(43,36,28,.42);
  --sh:0 4px 14px rgba(120,90,50,.08); --sh2:0 8px 24px rgba(120,90,50,.11);
  --shadow:0 18px 50px rgba(120,90,50,.18);
  --r:22px; --rs:16px; --rx:999px;
}
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; padding:0; }
body{
  font-family:'Sarabun','Leelawadee UI','Segoe UI',system-ui,sans-serif;
  background:var(--ink); color:var(--plat);
  font-size:15px; line-height:1.5; min-height:100dvh;
  padding-bottom:env(safe-area-inset-bottom);
}
button{ font-family:'Mitr','Sarabun',sans-serif; cursor:pointer; color:inherit; }
input,select,textarea{ font-family:inherit; color:var(--plat); }
.num{ font-variant-numeric:tabular-nums; }
::-webkit-scrollbar{ width:10px; height:10px; }
::-webkit-scrollbar-thumb{ background:var(--line2); border-radius:99px; }
::-webkit-scrollbar-track{ background:transparent; }

/* ── Grundbausteine ─────────────────────────────────────────────── */
.scr{ display:none !important; } .scr.on{ display:block !important; }
.lbl{ font-family:'Mitr',sans-serif; font-size:11.5px; font-weight:400; color:var(--plat2); }
.dim{ font-size:12.5px; color:var(--plat2); }
.dim2{ font-size:12px; color:var(--plat2); }
.card{ background:var(--ink2); border-radius:var(--r); box-shadow:var(--sh); }
.hair{ height:1px; background:var(--line); border:0; margin:0; }
.big{ font-family:'Mitr',sans-serif; font-weight:600; font-variant-numeric:tabular-nums; line-height:1.1; }

/* ── Login ──────────────────────────────────────────────────────── */
#scr-login.on{ display:flex !important; align-items:center; justify-content:center; }
#scr-login{ min-height:100dvh; padding:26px 18px; }
.loginbox{ width:100%; max-width:430px; }
.brand{ text-align:center; margin-bottom:26px; }
.brand .mark{
  width:64px; height:64px; margin:0 auto 14px; border-radius:22px;
  background:var(--ice); color:#fff; display:flex; align-items:center; justify-content:center;
  font-family:'Mitr',sans-serif; font-weight:600; font-size:22px; box-shadow:var(--sh2);
}
.brand h1{ margin:0; font-family:'Mitr',sans-serif; font-size:26px; font-weight:600; }
.brand p{ margin:2px 0 0; font-size:13px; color:var(--plat2); }
.stafflist{ display:grid; gap:9px; max-height:54vh; overflow-y:auto; padding:4px; }
.staffbtn{
  display:flex; align-items:center; gap:13px; width:100%; text-align:left;
  padding:13px 15px; border-radius:var(--rs); border:none; background:var(--ink2);
  box-shadow:var(--sh); font-size:15px; font-family:'Sarabun',sans-serif;
}
.staffbtn:hover{ box-shadow:var(--sh2); }
.staffbtn .av{
  width:40px; height:40px; border-radius:50%; flex-shrink:0; background:var(--ice-dim); color:var(--ice2);
  display:flex; align-items:center; justify-content:center; font-family:'Mitr',sans-serif; font-size:13px; font-weight:600;
}
.pinwrap{ text-align:center; }
.dots{ display:flex; gap:13px; justify-content:center; margin:20px 0 22px; min-height:16px; }
.dots i{ width:14px; height:14px; border-radius:50%; border:2px solid var(--ice); background:transparent; transition:background .15s; }
.dots i.f{ background:var(--ice); }
.pad{ display:grid; grid-template-columns:repeat(3,1fr); gap:11px; }
.pad button{ padding:17px 0; font-size:22px; font-weight:400; border-radius:var(--rs); border:none; background:var(--ink2); box-shadow:var(--sh); }
.pad button:active{ background:var(--ice-dim); transform:scale(.96); }
.pad button.ghost{ background:transparent; box-shadow:none; color:var(--plat2); font-size:18px; }
.err{ color:var(--coral); min-height:19px; font-size:13px; margin-top:12px; }
.linkbtn{ background:none; border:none; color:var(--plat2); font-size:14px; padding:11px; margin-top:6px; }

/* ── Kopfleiste ─────────────────────────────────────────────────── */
#bar{ position:sticky; top:0; z-index:40; background:var(--barbg); backdrop-filter:blur(14px); box-shadow:0 1px 0 var(--line); }
.barin{ max-width:1500px; margin:0 auto; padding:10px 18px; display:flex; align-items:center; gap:14px; }
.logo{ display:flex; align-items:center; gap:10px; flex-shrink:0; }
.logo .m{ width:34px; height:34px; border-radius:11px; background:var(--ice); color:#fff; display:flex; align-items:center; justify-content:center; font-family:'Mitr',sans-serif; font-size:12px; font-weight:600; }
.logo b{ font-family:'Mitr',sans-serif; font-weight:600; font-size:16px; }
.logo span{ font-size:11px; color:var(--plat2); display:block; margin-top:-3px; }
.nav{ display:flex; gap:6px; margin-left:auto; overflow-x:auto; scrollbar-width:none; }
.nav::-webkit-scrollbar{ display:none; }
.nav button{
  flex-shrink:0; padding:9px 16px; border-radius:var(--rx); border:none; background:transparent;
  color:var(--plat2); font-size:13.5px; font-weight:400; white-space:nowrap; display:flex; align-items:center; gap:7px;
}
.nav button:hover{ background:var(--ink2); color:var(--plat); }
.nav button.on{ background:var(--jade); color:#fff; box-shadow:var(--sh); }
.nav .n{ font-size:11.5px; opacity:.9; font-variant-numeric:tabular-nums; background:rgba(255,255,255,.22); border-radius:var(--rx); padding:0 7px; }
.nav button:not(.on) .n{ background:var(--ink4); color:var(--plat2); }
.who{ display:flex; align-items:center; gap:8px; flex-shrink:0; }
.who .av{ width:34px; height:34px; border-radius:50%; background:var(--ice-dim); color:var(--ice2); display:flex; align-items:center; justify-content:center; font-family:'Mitr',sans-serif; font-size:12px; font-weight:600; }
.iconbtn{ border:none; background:var(--ink2); box-shadow:var(--sh); border-radius:12px; padding:7px 11px; font-size:14px; color:var(--plat2); }

/* ── Vorschau / Demo-Leiste ─────────────────────────────────────── */
#livebar:empty{ display:none; }
.livebar{ max-width:1500px; margin:14px auto 0; padding:0 18px; }
.livebar > div{
  display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding:11px 16px; border-radius:var(--rs);
  font-size:13px; background:var(--amber-dim); color:var(--amber);
}
.livebar b{ font-family:'Mitr',sans-serif; font-weight:400; }
.livedot{ width:8px; height:8px; border-radius:50%; background:var(--jade); }

/* ── Kennzahlen ─────────────────────────────────────────────────── */
#kpi{ max-width:1500px; margin:0 auto; padding:16px 18px 6px; display:grid; gap:12px; grid-template-columns:repeat(auto-fit, minmax(160px,1fr)); }
.kpi{ padding:14px 16px; border-radius:var(--rs); background:var(--ink2); box-shadow:var(--sh); text-align:left; }
.kpi .v{ font-size:28px; margin-top:2px; color:var(--ice); }
.kpi .s{ font-size:12px; color:var(--plat2); margin-top:2px; }

main{ max-width:1500px; margin:0 auto; padding:10px 18px 64px; }
.view{ display:none; } .view.on{ display:block; }

/* ── Werkzeugleiste / Chips ─────────────────────────────────────── */
.tools{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:14px 0 12px; }
.chip{
  padding:8px 15px; border-radius:var(--rx); border:none; background:var(--ink2); box-shadow:var(--sh);
  color:var(--plat2); font-size:13px; display:inline-flex; align-items:center; gap:7px; white-space:nowrap;
}
.chip:hover{ color:var(--plat); box-shadow:var(--sh2); }
.chip.on{ background:var(--jade); color:#fff; }
.chip b{ font-weight:400; font-variant-numeric:tabular-nums; opacity:.9; }
.chip .d{ width:7px; height:7px; border-radius:50%; flex-shrink:0; }
.search{ flex:1 1 220px; min-width:170px; padding:9px 16px; border-radius:var(--rx); border:none; background:var(--ink2); box-shadow:var(--sh); font-size:13.5px; outline:none; }
.search:focus{ box-shadow:0 0 0 3px var(--ice-line), var(--sh); }
.search::placeholder{ color:var(--plat3); }

/* ── Plan: Pool + Dock ──────────────────────────────────────────── */
#plan-grid{ display:grid; gap:16px; align-items:start; }
.zone{ border-radius:var(--r); background:var(--ink2); box-shadow:var(--sh2); padding:16px; margin-bottom:14px; }
.zone-h{ display:flex; align-items:flex-start; gap:12px; justify-content:space-between; }
.zone-h .nm{ font-family:'Mitr',sans-serif; font-size:19px; font-weight:600; }
.zone-h .chip{ background:var(--jade); color:#fff; box-shadow:none; }
.meter{ height:8px; background:var(--track); margin:12px 0 0; border-radius:99px; overflow:hidden; }
.meter i{ display:block; height:100%; border-radius:99px; transition:width .35s; }
.zone-m{ padding:6px 0 4px; display:flex; justify-content:space-between; align-items:baseline; gap:10px; }
.ord{ display:flex; gap:12px; padding:12px 14px; margin-top:8px; border-radius:var(--rs); background:var(--ink); cursor:pointer; align-items:flex-start; }
.ord:hover{ background:var(--ink3); }
.ord.on{ background:var(--jade-dim); box-shadow:inset 0 0 0 2px var(--jade); }
.ord .hd{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.ord .id{ font-family:'Mitr',sans-serif; font-size:14px; font-weight:600; }
.ord .cu{ font-size:13.5px; margin-top:2px; }
.ord .amt{ font-family:'Mitr',sans-serif; font-size:17px; font-weight:600; color:var(--ice); white-space:nowrap; font-variant-numeric:tabular-nums; }
.ord .rt{ display:flex; flex-direction:column; align-items:flex-end; gap:8px; flex-shrink:0; }

.ord.on .tick{ background:var(--jade); color:#fff; }
.tag{ font-size:11px; padding:2px 9px; border-radius:var(--rx); white-space:nowrap; font-family:'Mitr',sans-serif; }
.t-ice{ background:var(--ice-dim); color:var(--ice2); }
.t-jade{ background:var(--jade-dim); color:var(--jade); }
.t-amber{ background:var(--amber-dim); color:var(--amber); }
.t-coral{ background:var(--coral-dim); color:var(--coral); }
.t-mute{ background:var(--ink4); color:var(--plat2); }

#dock{ position:sticky; top:74px; }
.dockin{ border-radius:var(--r); background:var(--ink2); box-shadow:var(--sh2); padding:16px; }
.dock-h{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px; }
.dock-h .t{ font-family:'Mitr',sans-serif; font-size:17px; font-weight:600; }
.sums{ display:grid; grid-template-columns:repeat(2,1fr); gap:8px; margin-bottom:13px; }
.sums > div{ background:var(--ink); border-radius:14px; padding:10px 12px; text-align:center; }
.sums .v{ font-size:22px; margin-top:2px; color:var(--ice); }
.picked{ max-height:230px; overflow-y:auto; margin-bottom:13px; display:grid; gap:6px; }
.prow{ display:flex; align-items:center; gap:9px; padding:9px 12px; border-radius:12px; background:var(--ink); }
.zdot{ width:8px; height:8px; border-radius:50%; flex-shrink:0; }
.xbtn{ border:none; background:none; color:var(--coral); font-size:16px; padding:2px 4px; flex-shrink:0; }
.drvgrid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(96px,1fr)); gap:8px; margin-bottom:13px; }
.drv{ display:flex; flex-direction:column; align-items:center; gap:4px; padding:12px 5px; border-radius:var(--rs); border:none; background:var(--ink); }
.drv:hover{ background:var(--ink3); }
.drv.on{ background:var(--jade); color:#fff; }
.drv.busy{ box-shadow:inset 0 0 0 2px var(--line2); }
.drv .av{ width:32px; height:32px; border-radius:50%; background:var(--ink2); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:600; color:var(--plat2); }
.drv.on .av{ background:rgba(255,255,255,.25); color:#fff; }
.drv .nm{ font-size:12px; text-align:center; line-height:1.25; }
.drv .st{ font-size:10.5px; color:var(--plat3); text-align:center; line-height:1.2; }
.drv.on .st{ color:rgba(255,255,255,.85); }
.toggle{ display:flex; align-items:center; gap:9px; font-size:13px; color:var(--plat2); margin-bottom:13px; }
.toggle input{ width:17px; height:17px; accent-color:var(--jade); }

<!-- Positions-Logik, wortgleich aus index.html gezogen (siehe Kopf der Datei) -->
<script src="tour-geo.js"></script>
<script>
/* ══════════════════════════════════════════════════════════════════════════
   KP WALLPANEL · TOUR / DISPATCH
   Eigenständige Seite neben index.html — gleiche Datenbank, gleiche Knoten,
   eigenes Gesicht. Die App bleibt unangetastet; beides kann parallel laufen,
   weil beide auf denselben Feldern arbeiten und per Firebase live zusehen.

   Aufbau der Datei:
     1  Zustand + Firebase-Abos
     2  Übernommene Rechenwege aus index.html (Geld, Tour-Nummern)  ← wortgleich
     3  Login
     4  Rahmen (Navigation, Kennzahlen)
     5  PLAN   — Touren bauen
     6  TOURS  — laufende Touren, Stopps
     7  MONEY  — Kasse gegen Lohn
     8  Schreibwege in die Datenbank
   ══════════════════════════════════════════════════════════════════════════ */

/* ═══ 1 · ZUSTAND ═════════════════════════════════════════════════════════ */
var staffList=[], orders=[], activeTours=[], drivers=[], tourReg={}, tourHistory={}, shippers=[];
var me=null, view='plan';
var SESSION_MS=4*60*60*1000;                 // 4 h, wie im Büro-Login der App
var sel=[], selDriver=null, forceNew=false;
var fZone='', fStat='', q='', openTour={}, fDrv='';
var msg='', _tourSnap={}, _ready=false;
var TOUR_NODRIVER='__NODRIVER__', TOUR_NODRIVER_LABEL='⏳ ยังไม่กำหนดคนขับ / no driver yet';
var TRUCK=100000;                            // ฿ je Zone, ab dem sich eine Fahrt lohnt
// Zonenfarben gibt es zweimal: auf hellem Grund müssen sie dunkler sein, sonst
// verschwindet die Zonen-Überschrift im Weiss. Gleiche Reihenfolge, gleiche Zone.
var ZC={ 'Bangkok':'#3A6FC4','Northern':'#7A5AA8','Northeastern':'#B8801E',
         'Eastern':'#1F8A80','Southern':'#C4567A','Instore':'#3F7D5C','Unknown':'#7A6E5F' };
var ST={ ready:{l:'พร้อม / ready',c:'t-jade'}, packing:{l:'กำลังแพ็ค / packing',c:'t-amber'},
         new:{l:'ใหม่ / new',c:'t-ice'} };

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function n(v){ return (Number(v)||0).toLocaleString('en-US'); }
function zc(z){ return ZC[z]||ZC.Unknown; }
function initials(s){ return String(s||'?').trim().split(/\s+/).map(function(w){return w[0];}).join('').toUpperCase().slice(0,2); }
function todayStr(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fmtD(d){ if(!d) return '—'; var t=new Date(d+'T00:00:00'); if(isNaN(t)) return d;
  return String(t.getDate()).padStart(2,'0')+'/'+String(t.getMonth()+1).padStart(2,'0')+'/'+t.getFullYear(); }
function hhmm(){ var d=new Date(); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function ordKey(id){ return String(id||'').replace(/[^a-zA-Z0-9]/g,'_'); }
function tourKey(id){ return String(id||'').replace(/[.#$/\[\]]/g,'_'); }   // Firebase verbietet . # $ / [ ]
function readOnly(){ return !!(me && (me.logisticsMode || me.shopMode)); }

/* ── Fahrernamen auf Thai ──────────────────────────────────────────────────
   In der App stehen die Namen lateinisch (Go, Aoo, Oum), am Telefon und auf dem
   Hof heissen die Leute โก้, อู๋, อูม. Wer anruft, braucht die thailändische
   Schreibweise — also stehen beide da. Übernommen aus index.html.            */
var NAME_TH={ 'GO':'โก้','AOO':'อู๋','OUM':'อูม','CHAN':'ชาญ' };
var _nameMap=null, _nameMapN=-1;
function nameMapBuild(){
  var m={}; Object.keys(NAME_TH).forEach(function(k){ m[k]=NAME_TH[k]; });
  staffList.forEach(function(s){
    var nm=String((s&&s.name)||'').trim(); if(!nm) return;
    var th=(s&&s.nameTh)?String(s.nameTh).trim()
         :(nm.match(/[฀-๿]+(?:[฀-๿\s]*[฀-๿])?/g)||[]).join(' ').trim();
    if(!th) return;
    var lat=nm.replace(/[฀-๿]+/g,' ').replace(/[-–—·+]/g,' ').replace(/\s+/g,' ').trim();
    if(!lat) return;
    [lat, lat.split(' ')[0]].forEach(function(k){ k=String(k||'').toUpperCase(); if(k) m[k]=th; });
  });
  _nameMap=m; _nameMapN=staffList.length;
}
function nameTh(v){
  var s=String(v==null?'':v).trim();
  if(!s || /[฀-๿]/.test(s)) return '';        // steht schon auf Thai
  if(!_nameMap || _nameMapN!==staffList.length) nameMapBuild();
  // Nur ein VOLLER Treffer zählt: bei "Go + Chan" wäre eine der beiden
  // Schreibweisen schlicht falsch.
  return _nameMap[s.toUpperCase().replace(/[-–—·+]/g,' ').replace(/\s+/g,' ').trim()]||'';
}
function kpName(v){ var s=String(v==null?'':v), th=nameTh(s); return th?(s+' · '+th):s; }

/* Fahrer werden AUS staffList abgeleitet, nicht aus dem drivers-Knoten — der
   ist nur ein Rest und hat längst nicht alle. Gleiche Regel wie in index.html:
   isDriver und nicht away. */
function rebuildDrivers(){
  drivers = staffList.filter(function(s){ return s.isDriver && !s.away; })
    .map(function(s){ return { id:s.driverId||s.id, name:s.name, phone:s.phone||'', vehicle:s.vehicle||'' }; });
}

/* ═══ 2 · ÜBERNOMMENE RECHENWEGE ══════════════════════════════════════════
   Wortgleich aus index.html. Geldbeträge und Tour-Nummern dürfen NICHT zweimal
   erfunden werden — eine zweite Formel, die um 1 ฿ abweicht, ist ein Fehler,
   den niemand findet. Wer hier etwas ändert, ändert es auch in index.html.   */

// Ganze Baht: alle Trennzeichen raus, damit "17.873 ฿" 17873 ergibt und nicht 17.
function orderTotal(o){ return parseInt(String((o&&o.total)||'').replace(/[^0-9]/g,''),10)||0; }

// Was auf EINER Order insgesamt bezahlt ist, aufgeteilt in Bar/Überweisung.
function payCO(o){
  var pc=parseFloat(o&&o.paidCash)||0, po=parseFloat(o&&o.paidOnline)||0;
  if(pc>0||po>0){
    // paidCash/paidOnline ist die Momentaufnahme EINER Zahlung. Wird später
    // aufgestockt, steigt paidAmount, die Aufteilung bleibt stehen — der Rest
    // muss dazugerechnet werden, sonst verschwindet Geld.
    var amt=(o&&o.paidAmount!=null&&o.paidAmount!=='')?(parseFloat(o.paidAmount)||0):0;
    var rest=Math.round((amt-(pc+po))*100)/100;
    if(rest>0){
      var m=(o.payMethod||o.payMethodPartial||'');
      if(m==='online') po+=rest;
      else if(m==='cash') pc+=rest;
      else return {cash:pc, online:po, unknown:rest};   // nie eine Banknote erfinden
    }
    return {cash:pc, online:po, unknown:0};
  }
  var a=(o&&o.paidAmount!=null&&o.paidAmount!=='')?(parseFloat(o.paidAmount)||0):((o&&o.payMethod)?orderTotal(o):0);
  if(a>0){
    var mm=(o.payMethod||o.payMethodPartial||'');
    if(mm==='online') return {cash:0, online:a, unknown:0};
    if(mm==='cash')   return {cash:a, online:0, unknown:0};
    return {cash:0, online:0, unknown:a};              // bezahlt, aber Weg unbekannt
  }
  return {cash:0, online:0, unknown:0};
}

// Was der Fahrer auf DIESER Fahrt kassiert hat — nicht, was die Order je gezahlt hat.
function tourPayCO(t, o){
  var full=payCO(o||{});
  if(!t||!o) return full;
  // Die Liefermaske schreibt seit 09/2026 auf, was an diesem Stopp kassiert wurde.
  // Das ist eine Auskunft und schlägt jede Datumsheuristik.
  var tp=o.tourPay;
  if(tp && ((parseFloat(tp.cash)||0)>0 || (parseFloat(tp.online)||0)>0)){
    var tc=parseFloat(tp.cash)||0, to=parseFloat(tp.online)||0;
    var all=(o.paidAmount!=null&&o.paidAmount!=='')?(parseFloat(o.paidAmount)||0):(tc+to);
    return {cash:tc, online:to, unknown:0, pre:Math.max(0, Math.round((all-tc-to)*100)/100)};
  }
  var dep=t.departedDate||'', pd=String(o.payDate||'');
  var snap=(parseFloat(o.paidCash)||0)+(parseFloat(o.paidOnline)||0);
  var tot=(o.paidAmount!=null&&o.paidAmount!=='')?(parseFloat(o.paidAmount)||0):0;
  var later=Math.max(0, Math.round((tot-snap)*100)/100);
  // Ein Zahlungsdatum VOR der Abfahrt ist der einzige Beleg dafür, dass das Geld
  // nicht auf dieser Fahrt kassiert wurde. Ohne diesen Beleg gehört es zur Fahrt.
  if(!(dep && pd && pd<dep)) return full;
  if(later>0 && snap>0){
    var m=(o.payMethod||o.payMethodPartial||''), r={cash:0, online:0, unknown:0, pre:snap};
    if(m==='online') r.online=later; else if(m==='cash') r.cash=later; else r.unknown=later;
    return r;
  }
  return {cash:0, online:0, unknown:0, pre:(full.cash+full.online+(full.unknown||0))};
}

// Zuschläge/Abzüge auf einer Tour.
function adjArr(t){ var a=(t&&t.adj); return Array.isArray(a)?a:(a&&typeof a==='object'?Object.keys(a).map(function(k){return a[k];}):[]); }
function adjSign(e){ var s=parseInt(e&&e.sign,10); return (s===-1||s===1)?s:0; }
function adjVal(e){ return adjSign(e)*Math.abs(parseFloat(e&&e.amt)||0); }
function adjTotal(t){ return adjArr(t).reduce(function(a,e){ return a+adjVal(e); },0); }
// Was am Ende der Fahrt übergeben wird: verdient − Vorschuss ± Zuschläge.
function netPay(t){ return Math.max(0,(parseFloat(t.driverPay)||0)-(parseFloat(t.driverAdvance)||0)+adjTotal(t)); }

// Der Status eines Stopps: ein am ORDER-Datensatz abgeschlossener Zustand gewinnt,
// sonst steht er in der Tour.
function stopStatus(t, id){
  var raw=((t&&t.status)||{})[id]||'loaded';
  if(raw==='delivered'||raw==='cancelled'||raw==='shipped') return raw;
  var o=orders.find(function(x){return x.id===id;});
  return (o&&o.status)||raw;
}

// ── Tour-Nummern (260915-1). Wortgleich übernommen, weil eine zweite Nummer
//    für dieselbe Tour praktisch nicht mehr einzufangen ist. ──────────────
function tidOk(v){ return typeof v==='string' && /^\d{6}-\d+$/.test(v); }
function tidDayStr(d){ d=d||new Date(); return String(d.getFullYear()%100).padStart(2,'0')+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0'); }
function tidDay(v){ return tidOk(v)?v.split('-')[0]:''; }
function tidSeq(v){ return tidOk(v)?(parseInt(v.split('-')[1])||0):0; }
function tidSortKey(v){ return tidOk(v)?(parseInt(tidDay(v))*100000+tidSeq(v)):0; }
function tourDayOf(t){
  var d=t&&t.tourDay;
  if(d && /^\d{4}-\d{2}-\d{2}$/.test(d)){ var dt=new Date(d+'T00:00:00'); if(!isNaN(dt)) return tidDayStr(dt); }
  return tidDayStr();
}
// Höchste auf DIESEM Tag schon vergebene Nummer — der Boden für die nächste,
// damit eine verlorene Zählung nie dieselbe Nummer zweimal ausgibt.
function maxSeqOfDay(day){
  var mx=0, chk=function(v){ if(tidDay(v)===day){ var s=tidSeq(v); if(s>mx) mx=s; } };
  Object.keys(tourReg||{}).forEach(chk);
  activeTours.forEach(function(t){ chk(t&&t.tid); });
  Object.keys(tourHistory||{}).forEach(function(dk){
    var recs=tourHistory[dk]||{};
    Object.keys(recs).forEach(function(k){ chk((recs[k]||{}).tid); });
  });
  return mx;
}
var _noPending={}, _noSeeded={};
function noKey(rawId){ return tourKey(rawId); }
// Eine Nummer in EINER Transaktion beanspruchen. _max zählt nie herunter.
function noClaim(rawId, day, floor, cb){
  var key=noKey(rawId);
  // DEMO: Nummern werden lokal vergeben, nach derselben Regel (nie unter dem
  // höchsten schon vergebenen Stand). Vorschau auf echten Daten prägt keine.
  if(DEMO){ cb(floor+1); return; }
  if(!LIVE){ cb(0); return; }
  try{
    W.ref('tourNo/'+day).transaction(function(cur){
      cur=cur||{};
      if((parseInt(cur[key])||0)>0) return;             // schon beansprucht → behalten
      var mx=parseInt(cur._max)||0;
      for(var k in cur){ if(k!=='_max'){ var v=parseInt(cur[k])||0; if(v>mx) mx=v; } }
      if(floor>mx) mx=floor;
      cur._max=mx+1; cur[key]=mx+1;
      return cur;
    }, function(err, committed, snap){
      var v=0; try{ v=parseInt(((snap&&snap.val())||{})[key])||0; }catch(e){}
      if(v>0){ cb(v); return; }
      try{ DB.ref('tourNo/'+day+'/'+key).once('value',
        function(s){ cb(parseInt(s.val())||0); }, function(){ cb(0); }); }catch(e2){ cb(0); }
    }, false);   // applyLocally=false — nichts optimistisch schreiben
  }catch(e){ cb(0); }
}
function noSeed(rawId, tid){
  if(!rawId || !tidOk(tid)) return;
  var day=tidDay(tid), num=tidSeq(tid), key=noKey(rawId);
  if(!day || !num || _noSeeded[day+'/'+key]===num) return;
  _noSeeded[day+'/'+key]=num;
  try{
    W.ref('tourNo/'+day).transaction(function(cur){
      cur=cur||{};
      if((parseInt(cur[key])||0)>0) return;             // vorhandener Anspruch gewinnt
      cur[key]=num; cur._max=Math.max(parseInt(cur._max)||0, num);
      return cur;
    }, null, false);
  }catch(e){}
}
function regFindByTourId(tourId){
  if(!tourId) return null;
  var hit=null, hitPaid=false;
  Object.keys(tourReg||{}).forEach(function(k){
    if(!tidOk(k) || (tourReg[k]||{}).tourId!==tourId) return;
    var paid=!!(tourReg[k]||{}).paid;
    if(!hit || (paid&&!hitPaid) || (paid===hitPaid && tidSortKey(k)<tidSortKey(hit))){ hit=k; hitPaid=paid; }
  });
  return hit;
}
function regUpsert(t){
  if(!t||!tidOk(t.tid)) return;
  var old=(tourReg||{})[t.tid]||{};
  var rec={ id:t.tid, tourId:t.id||'', driverId:t.driverId||'', driverName:t.driverName||'',
    createdDate:(/^\d{4}-\d{2}-\d{2}$/.test(t.tourDay||'')?t.tourDay:(old.createdDate||todayStr())),
    createdAt:old.createdAt||t.created||hhmm(),
    departedDate:t.departedDate||old.departedDate||'', departedAt:t.departedAt||old.departedAt||'',
    backDate:t.backDate||old.backDate||'', backAt:t.backAt||old.backAt||'',
    endedDate:old.endedDate||'', endedAt:old.endedAt||'',
    state:(old.state==='deleted'?'deleted':(old.state==='ended'?'ended':'active')),
    orders:(t.orders||[]).slice(), orderCount:(t.orders||[]).length,
    // driverPay im Register = was wirklich ausgezahlt werden muss (Basis ± Zuschläge).
    driverPay:Math.max(0,(parseFloat(t.driverPay)||0)+adjTotal(t)),
    payBase:parseFloat(t.driverPay)||0, adjTotal:adjTotal(t),
    paid:!!old.paid, payVoid:!!old.payVoid, paidBy:old.paidBy||'', paidAt:old.paidAt||0,
    ts:old.ts||Date.now() };
  tourReg[t.tid]=rec;
  try{ W.ref('tourReg/'+t.tid).set(rec); }catch(e){}
  noSeed(t.id, t.tid);
}
function stampOrders(t){
  if(!t||!tidOk(t.tid)) return;
  (t.orders||[]).forEach(function(id){
    var o=orders.find(function(x){return x.id===id;});
    if(o && o.tourNo!==t.tid){ o.tourNo=t.tid; pushOrder(o); }
  });
}
function setTid(rawId, tid, dayIso){
  if(!tidOk(tid)||!rawId) return;
  var t=activeTours.find(function(x){ return x&&x.id===rawId; });
  var hasDay=!!(dayIso && /^\d{4}-\d{2}-\d{2}$/.test(dayIso));
  if(t){
    t.tid=tid; if(hasDay) t.tourDay=dayIso;
    stampOrders(t); regUpsert(t);
    try{ W.ref('activeTours/'+rawId+'/tid').set(tid);
         if(hasDay) W.ref('activeTours/'+rawId+'/tourDay').set(dayIso); }catch(e){}
  }
  noSeed(rawId, tid);
}
function allocNo(t){
  if(!t||!t.id || tidOk(t.tid)){ if(t&&tidOk(t.tid)) noSeed(t.id,t.tid); return; }
  if(_noPending[t.id]) return;
  var ex=regFindByTourId(t.id);            // schon registriert → übernehmen, nicht neu prägen
  if(ex){ setTid(t.id, ex); return; }
  _noPending[t.id]=1;
  var dayIso=(t.tourDay && /^\d{4}-\d{2}-\d{2}$/.test(t.tourDay))?t.tourDay:'';
  var day=tourDayOf(t), floor=maxSeqOfDay(day);
  noClaim(t.id, day, floor, function(num){
    delete _noPending[t.id];
    if(!(num>0)) return;                   // lieber keine Nummer als eine erfundene
    setTid(t.id, day+'-'+num, dayIso);
    setTimeout(render, 0);
  });
}

    var raw=s.val()?Object.values(s.val()):[];

    // die eigenen Änderungen schickt und nicht fremde überbügelt.

    activeTours.forEach(allocNo);

  });

}

    if(driving && n>3){ var last=list[n-1]; t.status[last.id]='delivered'; last.status='delivered'; delete last.paidAmount; delete last.paidCash; delete last.paidOnline; delete last.payMethod; }
    return t;
  };
  var D=function(id){ return drivers.find(function(d){return d.id===id;}); };
  activeTours=[ mk(tidDayStr()+'-1', D('d1'), 6, true, 1800),
                mk(tidDayStr()+'-2', D('d2'), 4, false, 1500),
                mk(tidDayStr()+'-3', null, 3, false, 0) ];
  activeTours[0].adj=[{oid:'', sign:1, amt:200, note:'ค่าทางด่วน / toll'}];

  // Zwei beendete, noch nicht ausgezahlte Touren im Register.
  tourReg={};
  [[-1,'d3',2200],[-2,'d4',1650]].forEach(function(r,i){
    var d=D(r[1]), k=tidDayStr(new Date(Date.now()+r[0]*86400000))+'-1';
    tourReg[k]={ id:k, tourId:'hist'+i, driverId:d.id, driverName:d.name, state:'ended', driverPay:r[2], payBase:r[2], adjTotal:0,
                 paid:false, payVoid:false, orderCount:ri(4,8), createdDate:day(r[0]), departedDate:day(r[0]), orders:[] };
  });
  activeTours.forEach(function(t){ regUpsert(t); });
}

}
function pinKey(k){ if(pinEntry.length>=8) return; pinEntry+=k; dotsRender(); if(pinEntry.length>=4) pinOk(true); }
function pinDel(){ pinEntry=pinEntry.slice(0,-1); dotsRender(); $('pin-err').textContent=''; }
function pinOk(auto){
  if(!pinTarget) return;
  if(String(pinTarget.pin||'')!==pinEntry){

/* ═══ 5 · MENGEN & AUSWAHL ════════════════════════════════════════════════ */
function met(o){
  var p=(o.lineItems||[]).filter(function(i){return i.type==='panel';})
        .reduce(function(a,i){ return a+(parseInt(i.qty)||0); },0);
  if(!p) p=parseInt(o.panels)||0;
  return { panels:p, ctn:parseInt(o.ctn)||0, bun:parseInt(o.bundle)||0, baht:orderTotal(o) };
}
function sum(list){
  return list.reduce(function(a,o){ var m=met(o);
    a.n++; a.panels+=m.panels; a.ctn+=m.ctn; a.bun+=m.bun; a.baht+=m.baht; return a;
  },{n:0,panels:0,ctn:0,bun:0,baht:0});
}
// Alles, was auf eine Tour könnte und auf keiner steht.
function pool(){
  var used={};
  activeTours.forEach(function(t){ (t.orders||[]).forEach(function(id){ used[id]=1; }); });
  return orders.filter(function(o){ return ST[o.status] && !used[o.id]; });
}
function tourMoney(t){
  var m={cash:0,online:0,unknown:0};
  (t.orders||[]).forEach(function(id){
    if(((t.status||{})[id]||'')!=='delivered') return;
    var o=orders.find(function(x){return x.id===id;}); if(!o) return;
    var c=tourPayCO(t,o); m.cash+=c.cash; m.online+=c.online; m.unknown+=(c.unknown||0);
  });
  return m;
}
function prog(t){
  var done=0, open=0;
  (t.orders||[]).forEach(function(id){
    var s=stopStatus(t,id);
    if(s==='delivered'||s==='shipped') done++; else if(s!=='cancelled') open++;
  });
  var tot=(t.orders||[]).length;
  return { done:done, open:open, total:tot, pct:tot?Math.round(done/tot*100):0 };
}

/* ═══ 7 · ZONEN-BOARD ═════════════════════════════════════════════════════
   Funktion 1 (15.09., zweite Fassung): alle Zonen nebeneinander, je Zone NUR
   die Summe dessen, was noch keinem Fahrer zugewiesen ist — Betrag, CTN, มัด,
   Anzahl. Keine Karten.

   "Keinem Fahrer zugewiesen" heisst: die Order liegt auf keiner Tour, ODER sie
   liegt auf einer Tour, die noch keinen Fahrer hat. Das Buero stellt Touren
   morgens zusammen, bevor die Fahrer da sind — so eine geplante Tour ist noch
   nicht "weg", ihr Geld und ihre Kartons gehoeren weiter in die Zonensumme.
   Erst der Fahrer nimmt sie aus der Uebersicht.
   Die fuenf Zonen stehen immer da, auch bei 0 — man soll sehen, wo nichts ist. */
var ZONES=['Bangkok','Northern','Northeastern','Eastern','Southern'];
function tourHasDriver(t){ return !!(t && (t.driverId || (t.driverName && t.driverName!==TOUR_NODRIVER_LABEL))); }
// Orders, die noch keinem Fahrer gehoeren — mit Vermerk, ob sie schon auf einer
// (fahrerlosen) Tour liegen.
function unassigned(){
  var withDrv={}, planned={};
  activeTours.forEach(function(t){
    (t.orders||[]).forEach(function(id){ if(tourHasDriver(t)) withDrv[id]=1; else planned[id]=1; });
  });
  return orders.filter(function(o){
    if(['new','packing','ready','loaded'].indexOf(o.status)<0) return false;
    return !withDrv[o.id];
  }).map(function(o){ return { o:o, planned:!!planned[o.id] }; });
}
function boardHTML(){
  var byZ={};
  unassigned().forEach(function(x){ var z=x.o.zone||'Unknown'; (byZ[z]=byZ[z]||[]).push(x); });
  var cols=ZONES.slice();
  Object.keys(byZ).forEach(function(z){ if(cols.indexOf(z)<0) cols.push(z); });
  return '<div class="board">'+cols.map(function(z){
    var list=byZ[z]||[], s=sum(list.map(function(x){return x.o;}));
    var pl=list.filter(function(x){return x.planned;}).length;
    return '<div class="col col-sum">'
      +'<div class="col-h"><span class="nm" style="color:'+zc(z)+'">'+esc(z)+'</span>'
        +'<span class="cnt">'+list.length+' orders</span></div>'
      +'<div class="zamt">'+n(s.baht)+' <span>฿</span></div>'
      +'<div class="zctn">📦 '+n(s.ctn)+' <span>CTN</span>'+(s.bun?' · 🧶 '+n(s.bun)+' <span>มัด</span>':'')+'</div>'
      +(pl?'<div class="dim2" style="margin-top:6px">'+pl+' อยู่ในทัวร์ที่ยังไม่มีคนขับ / on a tour without driver</div>':'')
    +'</div>';
  }).join('')+'</div>';
}

/* ═══ 8 · VORPLANUNG ══════════════════════════════════════════════════════
   Funktion 2 (15.09.): Touren zusammenstellen, OHNE einen Fahrer zu wählen.
   Das Büro baut morgens die Ladungen; wer fährt, entscheidet sich später —
   in einem eigenen Bereich, der hier bewusst nicht vorkommt. Eine geplante Tour
   ist eine echte Tour ohne Fahrer (driverId leer, Name TOUR_NODRIVER_LABEL), sie
   bekommt ihre Nummer wie jede andere und zählt oben weiter zur Zonensumme.

   Bedienung: "+ neue Planung" oder "เพิ่ม / add" auf einer Karte öffnet den
   Wähler mit allen freien Orders; antippen, unten die Summe, bestätigen.
   ✕ an einer Order legt sie zurück in den Pool; die leere Planung löscht sich. */
function plannedTours(){ return activeTours.filter(function(t){ return !tourHasDriver(t); }); }

function planRemove(btn){
  var tid=btn.getAttribute('data-tid'), oid=btn.getAttribute('data-oid');

  ask('เอาออกจากแผน? / take out of the plan?', oid, function(){

    if(!t.orders.length){ activeTours=activeTours.filter(function(x){return x.id!==tid;}); W.ref('activeTours/'+tid).remove(); }
    else { pushTour(t); if(tidOk(t.tid)) regUpsert(t); }

  });

    (t.orders||[]).forEach(function(id){ var o=orders.find(function(x){return x.id===id;}); if(o && o.tourNo===t.tid){ delete o.tourNo; pushOrder(o); } });

/* ═══ 9 · ZONEN-KARTE ═════════════════════════════════════════════════════
   Funktion 3 (15.09.): alle geplanten Touren und alle freien Orders auf einer
   Karte. Jede Planung hat ihre Farbe, ihre Pins sind nummeriert in Ladefolge;
   freie Orders stehen gedämpft daneben. Antippen → in einen Plan legen oder aus
   ihm herausnehmen. Ein blasser Pin ist KEINE echte Position, sondern das, was
   die Adresse hergibt (Tambon-/Amphoe-Mitte); ein roter Pin ist eine Position,
   die die App anzweifelt (Grund im Kärtchen). Positionen kommen ausschliesslich
   aus tour-geo.js — dieselben wie in der App.                                */
var _map=null, _mapLayer=null, _mapFocus=null, _mapFit=false;
var PLAN_COLORS=['#C4653A','#7A5AA8','#3A6FC4','#1F8A80','#C4567A','#B8801E'];
function planColor(t){ var i=plannedTours().findIndex(function(x){ return x.id===t.id; }); return PLAN_COLORS[(i<0?0:i)%PLAN_COLORS.length]; }
function mapOpen(tid){
  _mapFocus=tid||null; _mapFit=false;
  var t=_mapFocus?activeTours.find(function(x){return x.id===_mapFocus;}):null;

// Wo eine Order gezeichnet wird — Fassung von _tmapPos aus der App ohne den
// Spediteur-Umweg (Vorplanung kennt noch keinen Shipper).
function mapPos(o){
  var a=kpAddrOf(o), pred=kpGeoPredict(o,a), c=orderLatLng(o);
  if(c){
    var res={lat:c.lat,lng:c.lng,approx:false,plevel:'pin'};
    if(pred){
      var km=kpKm(c.lat,c.lng,pred.lat,pred.lng); res.predKm=Math.round(km); res.pred=pred;
      if(km>kpGeoLimit(pred)){
        var g0=custGeoGet(o&&o.phone);
        if(!(g0&&g0.ok)){ res.suspect=Math.round(km); res.why=kpGeoWhy(o,c.lat,c.lng,pred,a); }
      }
    }
    return res;
  }
  return pred?{lat:pred.lat,lng:pred.lng,approx:true,plevel:pred.level,pred:pred}:null;
}
function lvlTxt(level){
  return level==='tambon' ? 'กลางตำบล ±2 กม. / sub-district centre'
       : level==='amphoe' ? 'กลางอำเภอ ±10 กม. / district centre'
       : level==='zip'    ? 'จากรหัสไปรษณีย์ / postal code'
       : 'ประมาณจากจังหวัด / province only';
}
function mapIcon(label,color,approx){

    html:'<div class="pin'+(approx?' approx':'')+'" style="background:'+color+'"><span>'+label+'</span></div>'});
}
function mapCard(o,p,ctx){
  var m=met(o), plans=plannedTours(), ro=readOnly();
  var h='<div style="min-width:190px"><div style="font-family:Mitr,sans-serif;font-size:14px">'+esc(o.id)+' · <span style="color:'+zc(o.zone||'Unknown')+'">'+esc(o.zone||'—')+'</span></div>'

    +(p.approx?'<div style="color:var(--amber);margin-top:3px">◌ '+esc(lvlTxt(p.plevel))+'</div>':'');

    if(!ro) h+='<button class="mapbtn" style="background:var(--coral-dim);color:var(--coral)" data-tid="'+esc(ctx.plan.id)+'" data-oid="'+esc(o.id)+'" onclick="mapRemove(this)">✕ เอาออกจากแผน / remove</button>';
  } else if(!ro){

        +'<option value="new">＋ แผนใหม่ / new plan</option></select>';

function mapRender(){
  if(!_map||!window.L) return;
  if(_mapLayer){ try{ _map.removeLayer(_mapLayer); }catch(e){} }
  _mapLayer=L.layerGroup().addTo(_map);
  var seen={}, bounds=[], focusB=[], noPos=[], nSus=0, nFree=0, nPlan=0;
  var place=function(o,label,color,ctx){
    var p=mapPos(o); if(!p){ noPos.push(o); return; }
    // Zweimal derselbe Punkt (gleiche Amphoe-Mitte, gleicher Kunde) → kleiner Ring,
    // damit jeder Pin greifbar bleibt. Nur so weit, wie die Position unsicher ist.
    var key=p.lat.toFixed(4)+','+p.lng.toFixed(4), k=seen[key]||0; seen[key]=k+1;
    var lat=p.lat, lng=p.lng;
    if(k>0){ var r=p.approx?(p.plevel==='tambon'?0.004:p.plevel==='amphoe'?0.012:0.03):0.0007, a=k*2.4; lat+=r*Math.cos(a); lng+=r*Math.sin(a); }
    if(p.suspect){ nSus++; color='#C9463D'; }
    var html=mapCard(o,p,ctx);
    L.marker([lat,lng],{icon:mapIcon(label,color,p.approx),zIndexOffset:ctx.plan?1000:0})
      .bindTooltip(html,{direction:'top',opacity:1,className:'tip'})
      .bindPopup(html,{maxWidth:300}).addTo(_mapLayer);
    bounds.push([lat,lng]); if(ctx.focus) focusB.push([lat,lng]);
  };
  plannedTours().forEach(function(t){
    var col=planColor(t), pts=[];
    (t.orders||[]).forEach(function(id,idx){
      var o=orders.find(function(x){return x.id===id;}); if(!o) return;
      nPlan++; var before=bounds.length;
      place(o,String(idx+1),col,{plan:t,seq:idx+1,focus:_mapFocus===t.id});
      if(bounds.length>before) pts.push(bounds[bounds.length-1]);
    });
    if(pts.length>1) L.polyline(pts,{color:col,weight:2.5,opacity:.45,dashArray:'6 7'}).addTo(_mapLayer);
  });
  pool().forEach(function(o){ nFree++; place(o,'+','#9A8E7C',{free:true}); });
  if(homeLoc && geoSane(homeLoc.lat,homeLoc.lng)){
    L.marker([homeLoc.lat,homeLoc.lng],{zIndexOffset:2000,icon:L.divIcon({className:'',iconSize:[30,30],iconAnchor:[15,15],tooltipAnchor:[0,-16],
      html:'<div style="width:30px;height:30px;border-radius:50%;background:#2B241C;border:2.5px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;font-size:15px">🏪</div>'})})
      .bindTooltip('🏪 ร้าน/คลัง / shop',{direction:'top',opacity:1}).addTo(_mapLayer);
    bounds.push([homeLoc.lat,homeLoc.lng]);
  }
  $('map-legend').innerHTML=
     plannedTours().map(function(t){ return '<span><b style="color:'+planColor(t)+'">●</b> '+esc(t.tid||'plan')+' ('+(t.orders||[]).length+')</span>'; }).join('')
    +'<span><b style="color:#9A8E7C">●</b> ว่าง / free ('+nFree+')</span>'
    +(nSus?'<span><b style="color:#C9463D">●</b> หมุดอาจผิด / suspect ('+nSus+')</span>':'')
    +'<span>จาง = จากที่อยู่ ไม่ใช่หมุดจริง / faded = from the address, not a real pin</span>'
    +(kpGeoReady()?'':'<span>⏳ กำลังโหลดฐานตำบล / loading sub-district table…</span>');
  $('map-missing').innerHTML=noPos.length?'🚫 ไม่มีตำแหน่ง / no position: '+noPos.map(function(o){return '<b>'+esc(o.id)+'</b>';}).join(', '):'';
  if(!_mapFit){
    _mapFit=true;
    var b=focusB.length?focusB:bounds;
    if(b.length){ try{ _map.fitBounds(b,{padding:[40,40],maxZoom:12}); }catch(e){} }
    else { try{ _map.setView([13.75,100.5],6); }catch(e){} }
  }
}
function mapAdd(el){
  var oid=el.getAttribute('data-oid'), tid=el.getAttribute('data-tid')||el.value; if(!oid||!tid||readOnly()) return;
  var o=orders.find(function(x){return x.id===oid;}); if(!o) return;
  var t=(tid==='new')?null:activeTours.find(function(x){return x.id===tid;});
  if(!t){ t={ id:'t'+Date.now(), driverId:'', driverName:TOUR_NODRIVER_LABEL, orders:[], status:{}, checks:{}, created:hhmm(), tourDay:todayStr() }; activeTours.push(t); }
  if(t.orders.indexOf(oid)<0){ t.orders.push(oid); t.status[oid]=o.status; }
  pushTour(t); if(tidOk(t.tid)){ stampOrders(t); regUpsert(t); } else allocNo(t);
  audit('tour','⏳ '+(t.tid||'plan'),'จากแผนที่ / from map +'+oid);

}
function mapRemove(btn){
  var tid=btn.getAttribute('data-tid'), oid=btn.getAttribute('data-oid');
  var t=activeTours.find(function(x){return x.id===tid;}); if(!t||readOnly()) return;
  t.orders=(t.orders||[]).filter(function(x){return x!==oid;}); delete t.status[oid];
  var o=orders.find(function(x){return x.id===oid;}); if(o && o.tourNo===t.tid){ delete o.tourNo; pushOrder(o); }
  if(!t.orders.length){ activeTours=activeTours.filter(function(x){return x.id!==tid;}); W.ref('activeTours/'+tid).remove(); }
  else { pushTour(t); if(tidOk(t.tid)) regUpsert(t); }
  audit('tour','⏳ '+(t.tid||'plan'),'จากแผนที่ / from map −'+oid);
  try{ _map.closePopup(); }catch(e){} render(); mapRender();
}

/* ═══ 9b · PIN-CHECK ══════════════════════════════════════════════════════
   Jede offene Order, deren Position die App anzweifelt, mit dem Grund — aus
   denselben Regeln wie in der App (kpGeoWhy). Zwei Antworten: "der Pin ist
   richtig" (still ab jetzt, und die App darf daraus lernen) und "Pin weg"
   (zurück auf die Adresse). Das Verschieben eines Pins und das Korrigieren einer
   Adresse bleiben vorerst in der App.                                        */
var _geoFilter='', _geoQ='', _geoRows=[];
function geoOpen(){
  sheetOpen('sheet-geo');
  $('geo-body').innerHTML='<div class="empty" style="padding:26px">⏳ กำลังโหลดฐานตำบล / loading the sub-district table…</div>';
  kpGeoLoad(function(ok){
    if(!ok){ $('geo-body').innerHTML='<div class="empty" style="padding:22px;color:var(--coral)">โหลด data/th-geo.json ไม่ได้ / could not load data/th-geo.json</div>'; return; }
    geoRender();
  });
}
function geoScan(){
  var sum={pin:0,pinOk:0,learn:0,tambon:0,amphoe:0,zip:0,prov:0,none:0,bad:0}, rows=[];
  orders.forEach(function(o){
    if(!o||['new','packing','ready','loaded'].indexOf(o.status)<0) return;
    var gi; try{ gi=orderGeoInfo(o); }catch(e){ return; }
    if(gi.pin){ sum.pin++; if(gi.ok) sum.pinOk++; }
    else if(gi.pred){ sum[gi.pred.src==='learn'?'learn':gi.pred.level==='tambon'?'tambon':gi.pred.level==='amphoe'?'amphoe':gi.pred.level==='zip'?'zip':'prov']++; }
    else sum.none++;
    if(gi.why){ rows.push({o:o,gi:gi,code:gi.why.code,hard:!!gi.why.hard}); if(gi.why.hard) sum.bad++; }
    else if(!gi.pin && gi.pred && gi.pred.level==='prov') rows.push({o:o,gi:gi,code:'vague',hard:true});
    else if(!gi.pin && !gi.pred) rows.push({o:o,gi:gi,code:'none',hard:true});
  });
  rows.sort(function(a,b){ if(a.hard!==b.hard) return a.hard?-1:1; return (b.gi.km||0)-(a.gi.km||0); });
  _geoRows=rows; return sum;
}
function geoSetFilter(c){ _geoFilter=c; geoRender(); }
function geoRender(){
  var sum=geoScan(), ro=readOnly();
  var chip=function(dot,col,l,v){ return '<span class="geochip"><span style="color:'+col+'">'+dot+'</span>'+l+' <b>'+v+'</b></span>'; };
  var head='<div class="geochips">'
    +chip('●','var(--jade)','หมุดจริง / real pin',sum.pin)
    +chip('◐','var(--ice)','เรียนรู้แล้ว / learned',sum.learn)
    +chip('◔','var(--violet)','กลางตำบล / sub-district',sum.tambon)
    +chip('◔','var(--amber)','กลางอำเภอ / district',sum.amphoe+sum.zip)
    +chip('◌','var(--plat3)','จังหวัดเท่านั้น / province only',sum.prov)
    +chip('🚫','var(--coral)','ไม่มีตำแหน่ง / none',sum.none)+'</div>';
  var byCode={}; _geoRows.forEach(function(r){ byCode[r.code]=(byCode[r.code]||0)+1; });
  var codes=Object.keys(byCode).sort(function(a,b){ return byCode[b]-byCode[a]; });
  var LBL=function(c){ return (typeof KP_WHY_LABEL!=='undefined'&&KP_WHY_LABEL[c])||(c==='none'?{th:'ไม่มีตำแหน่ง',en:'no position at all',fix:''}:{th:c,en:'',fix:''}); };
  var tabs='<div class="tools" style="margin:0 0 10px"><button class="chip '+(!_geoFilter?'on':'')+'" onclick="geoSetFilter(\'\')">ทั้งหมด / all <b>'+_geoRows.length+'</b></button>'
    +codes.map(function(c){ return '<button class="chip '+(_geoFilter===c?'on':'')+'" data-c="'+esc(c)+'" onclick="geoSetFilter(this.getAttribute(\'data-c\'))" title="'+esc(LBL(c).en)+'">'+esc(LBL(c).th)+' <b>'+byCode[c]+'</b></button>'; }).join('')
    +'<input class="search" id="geo-q" value="'+esc(_geoQ)+'" oninput="_geoQ=this.value;geoRender();$(\'geo-q\').focus()" placeholder="ค้นหา / search order, ชื่อ, ที่อยู่, เบอร์"></div>';
  var q=_geoQ.trim().toLowerCase();
  var list=_geoRows.filter(function(r){ if(_geoFilter&&r.code!==_geoFilter) return false; if(!q) return true;
    return (String(r.o.id)+' '+(r.o.customer||'')+' '+(r.o.address||'')+' '+(r.o.phone||'')).toLowerCase().indexOf(q)>=0; });
  var body=list.slice(0,120).map(function(r){
    var o=r.o, gi=r.gi, L=LBL(r.code), w=gi.why||{th:L.th,en:L.en}, a=gi.addr||{};
    var where=a.tambon?('ต.'+a.tambon+' อ.'+a.amphoe+' จ.'+a.prov):a.amphoe?('อ.'+a.amphoe+' จ.'+a.prov):a.prov?('จ.'+a.prov):'—';
    var src=gi.pin?geoPosSrc(o):null;
    return '<div class="georow"><div class="hd"><span style="font-family:Mitr,sans-serif">'+esc(o.id)+'</span>'
      +'<span class="dim2" style="flex:1;min-width:90px">'+esc(o.customer||'—')+'</span>'
      +'<span class="tag '+(r.hard?'t-coral':'t-amber')+'">'+esc(L.th)+(gi.km!=null?' · '+gi.km+' กม.':'')+'</span></div>'
      +'<div class="dim2" style="margin-top:3px">📍 '+esc(o.address||'—')+'</div>'
      +'<div class="dim2">ที่อยู่อ่านได้ / reads as: <b style="color:var(--plat)">'+esc(where)+'</b>'+(gi.pred?' · '+esc(gi.pred.labelTh):'')+'</div>'
      +(src?'<div class="dim2">ที่มาหมุด / pin from: '+esc(src.th)+' · '+esc(src.en)+'</div>':'')
      +'<div class="dim2" style="color:var(--plat3)">'+esc(w.en||L.en)+(L.fix?' → '+esc(L.fix):'')+'</div>'
      +(ro?'':'<div class="acts">'
        +(gi.pin?'<button class="btn btn-jade" data-oid="'+esc(o.id)+'" onclick="geoAccept(this)">✓ หมุดถูกต้อง / pin is right</button>':'')
        +(gi.pin?'<button class="btn btn-coral" data-oid="'+esc(o.id)+'" onclick="geoDrop(this)">🗑 ลบหมุด / drop pin</button>':'')
        +(gi.pin?'<a class="btn" href="https://www.google.com/maps/search/?api=1&query='+gi.pin.lat+','+gi.pin.lng+'" target="_blank" style="text-decoration:none">🌐 map</a>':'')
        +'</div>')
      +'</div>';
  }).join('') || '<div class="empty" style="padding:22px">✅ ไม่มีปัญหา / nothing to check</div>';
  var more=list.length>120?'<div class="dim2" style="text-align:center;padding:6px">… อีก '+(list.length-120)+' / '+(list.length-120)+' more — use the search</div>':'';
  $('geo-body').innerHTML=head+tabs+'<div class="geolist">'+body+more+'</div>';
}
// "Der Pin ist richtig, die Warnung nicht." Ein Stück Wissen: still ab jetzt,
// und die App darf ab jetzt daraus lernen. Ein bestätigter Link wird zum Pin.
function geoAccept(btn){
  var oid=btn.getAttribute('data-oid'), o=orders.find(function(x){return x.id===oid;}); if(!o||readOnly()) return;
  var k=normPhone(o.phone); if(!k){ ask('ไม่มีเบอร์ลูกค้า / no phone on this order','',null); return; }
  var g=custGeoGet(o.phone);
  if(!g){ var lp=orderLinkLatLng(o); if(!lp) return; g={lat:lp.lat,lng:lp.lng,src:'maplink',at:new Date().toISOString(),by:(me?me.name:'Tour')}; }
  ask('✓ ยืนยันว่าหมุดนี้ถูกต้อง? / confirm this pin is right?','หยุดเตือน และให้แอปเรียนรู้จากหมุดนี้ / it stops warning and gets learned from', function(){
    g.ok=true; g.okBy=(me?me.name:'Tour'); g.okAt=new Date().toISOString();
    customerMeta[k]=customerMeta[k]||{}; customerMeta[k].geo=g;
    W.ref('customerMeta/'+k+'/geo').set(g);
    audit('edit',oid,'✓ ยืนยันหมุด GPS / GPS pin confirmed (tour.html pin check)');
    geoRender(); if(_map) mapRender();
  });
}
// "Pin weg." Die Karte fällt zurück auf die Adresse. Der Pin landet im Papierkorb
// (pinTrash) wie in der App, ein Maps-Link auf der Order wird als falsch markiert.
function geoDrop(btn){
  var oid=btn.getAttribute('data-oid'), o=orders.find(function(x){return x.id===oid;}); if(!o||readOnly()) return;
  var k=normPhone(o.phone), g=k?custGeoGet(o.phone):null, lp=orderLinkLatLng(o);
  if(!g && !lp) return;
  ask('🗑 ลบตำแหน่งของ '+(o.customer||oid)+'? / remove this position?','แผนที่จะใช้ตำแหน่งจากที่อยู่แทน / the map falls back to the address', function(){
    if(g && k){
      W.ref('pinTrash/'+k).set({geo:g,reason:'wrong',orders:[String(oid)],customer:o.customer||'',address:String(o.address||'').slice(0,160),by:(me?me.name:'Tour'),at:new Date().toISOString()});
      if(customerMeta[k]) delete customerMeta[k].geo;
      W.ref('customerMeta/'+k+'/geo').remove();
    }
    if(lp){ delete o._geo; if(geoLinkOf(o)) o.geoBadLink=geoLinkOf(o); pushOrder(o); }
    audit('edit',oid,'🗑 ลบตำแหน่งผิด / wrong position removed (tour.html pin check)');
    geoRender(); if(_map) mapRender();
  });
}

/* ═══ 10 · SCHREIBEN ══════════════════════════════════════════════════════
   Es wird immer nur das geschrieben, was sich auf DIESEM Gerät geändert hat —
   nie der ganze Knoten. Ein .set() auf 'activeTours' würde die frisch gebaute
   Tour eines anderen Rechners wegwischen.                                     */
function forFb(t){
  var out={}; for(var k in t){ if(k!=='status'&&k!=='checks'&&k!=='kmRoute') out[k]=t[k]; }
  var s={}; if(t.status){ for(var a in t.status) s[tourKey(a)]=t.status[a]; }
  var c={}; if(t.checks){ for(var b in t.checks) c[tourKey(b)]=t.checks[b]; }
  out.status=s; out.checks=c; return out;
}
function pushTour(t){
  if(!t||!t.id) return;
  try{ W.ref('activeTours/'+t.id).set(forFb(t)); }catch(e){ console.error('pushTour', e); }
}
function pushOrder(o){
  if(!o||!o.id) return;
  try{ W.ref('orders/'+ordKey(o.id)).set(JSON.parse(JSON.stringify(o))); }catch(e){ console.error('pushOrder', e); }
}
function audit(type, subject, detail){
  try{ W.ref('auditLog').push({ type:type, orderId:subject, by:(me?me.name:'Tour'),
        detail:detail, ts:Date.now(), date:todayStr(), time:hhmm(), src:'tour.html' }); }catch(e){}
}

/* ═══ 10b · VORSCHAU / SCHARF ═════════════════════════════════════════════

      +'</div></div>'
    : LIVE
    ? ''
    : '<div class="livebar"><div>'
      +'<span>👁</span><b>โหมดดู / preview</b>'
      +'<span>ไม่บันทึกอะไรลงฐานข้อมูล · nothing you click is saved — the office app is untouched</span>'
      +(readOnly()?'':'<button class="btn btn-amber" style="margin-left:auto" onclick="liveAsk()">เปิดใช้จริง / go live</button>')
      +'</div></div>';
  var b=$('live-chip');
  if(b){ b.style.display=LIVE?'':'none'; }
}
function liveAsk(){
  ask('เปิดใช้จริง? / go live?',
      'ทุกอย่างที่กดจะบันทึกจริงและแอปออฟฟิศเห็นทันที / every click will be saved for real, the office app sees it at once',
      function(){ LIVE=true; try{ localStorage.setItem('kp-tour-live','1'); }catch(e){} audit('tour','🔓 tour.html','scharf geschaltet / went live'); render(); });
}
function liveOff(){
  LIVE=false; try{ localStorage.removeItem('kp-tour-live'); }catch(e){} render();
}

/* ═══ 12 · DIALOGE ════════════════════════════════════════════════════════ */
function sheetOpen(id){ $(id).classList.add('on'); }
function sheetClose(id){ $(id).classList.remove('on'); }
var _askFn=null;
function ask(title, body, fn){
  $('ask-t').textContent=title; $('ask-b').textContent=body||'';
  _askFn=fn||null; sheetOpen('sheet-ask');
}
function askYes(){ var f=_askFn; _askFn=null; sheetClose('sheet-ask'); if(f) f(); }
function askNo(){ _askFn=null; sheetClose('sheet-ask'); }
/* ═══ START ═══ Ganz zuletzt, wenn alles darueber steht: eine gemerkte Sitzung
   zeichnet sofort und braucht jede Konstante und jede Funktion der Datei. */
if(DEMO) demoBoot(); else tdAuthReady.then(boot);
</script>
